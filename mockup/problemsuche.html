<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fakturo Hilfe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap">
<style>
/* Layout: Suchmaschine. Startseite mit zentralem Suchfeld, danach Ergebnisspalte (links) + Produktinfo (rechts), geführte Fragen über den Ergebnissen. */
:root{
  --bg:#fbfcfb; --surface:#ffffff; --sunk:#f1f4f2; --fg:#18211e; --muted:#5b6964; --line:#dfe5e2;
  --accent:#0d6e60; --accent-soft:#e2f1ed; --accent-fg:#ffffff; --link:#1d5a9e; --ok:#2f7d3b; --warn:#a2560f;
  --f-display:"Manrope",ui-sans-serif,system-ui,sans-serif; --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:12px; --shadow:0 1px 6px rgba(24,33,30,.12);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121816; --surface:#1a2220; --sunk:#202a27; --fg:#e4ebe8; --muted:#9aa9a4; --line:#2e3a36;
  --accent:#5cc4b1; --accent-soft:#1d3632; --accent-fg:#0b1513; --link:#8ab8ec; --ok:#7ccf86; --warn:#e8a866; --shadow:0 1px 8px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --surface:#1a2220; --sunk:#202a27; --fg:#e4ebe8; --muted:#9aa9a4; --line:#2e3a36;
  --accent:#5cc4b1; --accent-soft:#1d3632; --accent-fg:#0b1513; --link:#8ab8ec; --ok:#7ccf86; --warn:#e8a866; --shadow:0 1px 8px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--link)}
.wrap{max-width:1120px;margin:0 auto}
.mockflag{font-size:12px;color:var(--muted);text-align:center;padding-block:8px}

/* Logo */
.logo{font-family:var(--f-display);font-weight:800;letter-spacing:-.03em;color:var(--fg);display:inline-flex;align-items:baseline;gap:0;border:0;background:none;padding:0}
.logo i{font-style:normal;color:var(--accent);margin-left:.22em}
.logo .dot{width:.22em;height:.22em;border-radius:50%;background:var(--accent);display:inline-block;margin-left:.06em}

/* Suchfeld */
.search{position:relative;width:100%}
.sbox{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:0 8px 0 18px;min-height:50px;box-shadow:var(--shadow)}
.search.open .sbox{border-radius:24px 24px 0 0;border-bottom-color:transparent}
.sbox svg{flex:none;color:var(--muted)}
.sbox input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;padding-block:12px}
.sbox .clear{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:6px 8px;border-radius:50%}
.sbox .go{border:0;background:var(--accent);color:var(--accent-fg);border-radius:20px;padding:8px 16px;font-weight:600;font-size:14px}
.ac{position:absolute;left:0;right:0;top:100%;background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 24px 24px;box-shadow:var(--shadow);z-index:20;padding-block:4px 10px;overflow:hidden}
.ac hr{border:0;border-top:1px solid var(--line);margin:0 16px 6px}
.ac button{display:flex;width:100%;align-items:center;gap:12px;border:0;background:none;text-align:left;padding:7px 18px;font-size:15px}
.ac button[aria-selected="true"],.ac button:hover{background:var(--sunk)}
.ac .ico{width:18px;color:var(--muted);flex:none;text-align:center;font-size:13px}
.ac .typ{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.ac b{font-weight:600}
.ac .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.ac .txt b{color:var(--fg)}

/* Startseite */
.home{display:flex;flex-direction:column;align-items:center;gap:26px;padding-block:9vh 48px}
.home .logo{font-size:clamp(44px,9vw,68px)}
.home .search{max-width:620px}
.home .lead{color:var(--muted);margin:-14px 0 0;text-align:center}
.home .trend{max-width:720px}
.katgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:720px}
.kat{display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-height:64px}
.kat:hover{border-color:var(--accent);background:var(--accent-soft)}
.kat .ki{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.kat:hover .ki{background:var(--surface)}
.kat strong{font-weight:500;font-size:15px;line-height:1.35;text-wrap:pretty}
.prodgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:620px}
.prod{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.prod:hover{border-color:var(--accent)}
.prod .pi{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;background:var(--accent-soft);color:var(--accent);margin-bottom:6px}
.prod strong{font-weight:600}
.prod span{font-size:13px;color:var(--muted)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.trend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:620px}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap}
.chip:hover{background:var(--sunk)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.chip .x{color:var(--muted);font-size:16px;line-height:1}
.chip small{color:var(--muted);font-size:12px}

/* Ergebnisseite */
.top{display:flex;align-items:center;gap:24px;padding-block:18px 10px;flex-wrap:wrap}
.top .logo{font-size:28px}
.top .search{flex:1;max-width:640px;min-width:240px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tabs small{font-size:12px;opacity:.8}
.cols{display:grid;grid-template-columns:minmax(0,640px) minmax(0,360px);gap:48px;padding-block:16px 60px;align-items:start}
.main{display:flex;flex-direction:column;gap:22px;min-width:0}
.stats{font-size:13px;color:var(--muted)}

/* Geführte Fragen */
.guide{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.guide .q{font-family:var(--f-display);font-weight:700;font-size:18px;text-wrap:balance}
.guide .row{display:flex;flex-wrap:wrap;gap:8px}
.guide .skip{border:0;background:none;color:var(--link);font-size:14px;padding:6px 4px}
.steps{display:flex;gap:6px;align-items:center}
.steps i{width:22px;height:4px;border-radius:2px;background:var(--line)}
.steps i.done{background:var(--accent)}
.qhint{margin:-4px 0 0;font-size:14px;color:var(--muted)}
.chip.yes{border-color:var(--accent);color:var(--accent);font-weight:600}
.chip.other{border-style:dashed;color:var(--muted)}
.ursache{margin:0;font-size:14px;color:var(--muted)}
.ursache b{color:var(--fg);font-weight:600}
.pfad{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:p}
.pfad li{counter-increment:p;display:grid;grid-template-columns:24px 1fr;gap:2px 10px;font-size:14px}
.pfad li::before{content:counter(p);grid-row:span 2;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:600}
.pfad span{color:var(--muted)}
.pfad strong{font-weight:600}
.check{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.box.note{background:var(--accent-soft);border-color:transparent}
.answered{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Beste Lösung */
.best{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.best .bh{padding:14px 18px;background:var(--accent-soft);display:flex;gap:10px;align-items:center;font-size:13px;font-weight:600;color:var(--accent)}
.best .bb{padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px}
.best h3{margin:0;font-family:var(--f-display);font-size:19px}
.best ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}

/* Treffer */
.res{display:flex;flex-direction:column;gap:3px}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.crumb .fav{width:26px;height:26px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:12px;color:var(--accent);border:1px solid var(--line)}
.crumb .id{font-family:var(--f-mono);font-size:12px}
.res h3{margin:2px 0 0;font-size:19px;font-weight:500;line-height:1.3}
.res h3 button{border:0;background:none;padding:0;color:var(--link);text-align:left;font-size:inherit}
.res h3 button:hover{text-decoration:underline}
.res p{margin:0;color:var(--muted);font-size:14px}
.res p b{color:var(--fg);font-weight:600}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:12px;background:var(--sunk);border-radius:6px;padding:2px 8px;color:var(--muted)}

/* Ähnliche Fragen */
.paa{display:flex;flex-direction:column}
.paa h2,.side h2{font-family:var(--f-display);font-size:18px;margin:0 0 6px}
.paa details{border-bottom:1px solid var(--line)}
.paa summary{list-style:none;cursor:pointer;padding:13px 4px;display:flex;justify-content:space-between;gap:12px;font-size:15px}
.paa summary::-webkit-details-marker{display:none}
.paa summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-top:5px;flex:none;transition:transform .15s}
.paa details[open] summary::after{transform:rotate(-135deg);margin-top:9px}
.paa .ans{padding:0 4px 14px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.linkbtn{align-self:flex-start;border:0;background:none;padding:0;color:var(--link);font-size:14px}

/* Seitenleiste */
.side{border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.side .ph{display:flex;gap:12px;align-items:center}
.side .ph .pi{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:18px;background:var(--accent-soft);color:var(--accent)}
.side p{margin:0;font-size:14px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.bar{display:grid;grid-template-columns:150px 1fr 24px;gap:8px;align-items:center;font-size:13px}
.bar span:nth-child(2){height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar span:nth-child(2) i{display:block;height:100%;background:var(--accent)}
.bar span:last-child{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{padding:24px 0;color:var(--muted)}
.empty strong{color:var(--fg)}

/* Detail */
.detail{max-width:720px;display:flex;flex-direction:column;gap:20px;padding-block:8px 60px}
.back{align-self:flex-start;border:0;background:none;color:var(--link);padding:0;font-size:14px}
.detail h1{font-family:var(--f-display);font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0;text-wrap:balance}
.detail .lead{font-size:16px;margin:0}
.box{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px 18px}
.box h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 10px;font-weight:600}
.solve{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.solve li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.solve li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:13px;font-weight:600}
.helpful{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.okmsg{color:var(--ok);font-weight:500}
textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px;font-size:14px;resize:vertical}
.json{overflow-x:auto;background:var(--sunk);border-radius:8px;padding:12px;font-family:var(--f-mono);font-size:12.5px;margin:10px 0 0;white-space:pre}
details.raw summary{cursor:pointer;color:var(--link);font-size:14px}

@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr);gap:28px}.top{gap:12px}.top .logo{font-size:24px}}
@media (max-width:560px){.katgrid{grid-template-columns:minmax(0,1fr)}.prodgrid{grid-template-columns:minmax(0,1fr)}.prod{flex-direction:row;align-items:center;gap:12px}.prod .pi{margin:0}.prod div{display:flex;flex-direction:column}.sbox .go{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

rnehmen anfahrt", "ursache": "Die Zeitübernahme nimmt standardmäßig alle Buchungsarten mit.", "pruefen": "Auftrag › Zeiten: Buchungsart je Zeile ansehen\nEinstellungen › Zeitübernahme öffnen", "loesung": "Einstellungen › Zeitübernahme öffnen\nPausen ausschließen\nFahrzeit als eigene Leistungsart „Anfahrt“ übernehmen", "hinweis": "Ob Fahrzeit berechnet wird, entscheidet der Betrieb, nicht der Support."}, "erstellt": "2026-09-22T05:00:00Z"}, {"id": "SUP-019", "name": "Kundenrabatt gilt nicht für Material", "kategorie": "Auftragsdetails: Material und Leistungen erfassen und berechnen", "bezeichnung": "Der Kundenrabatt ist nur auf Leistungen eingestellt. Für Material gibt es einen eigenen Rabattsatz.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Abrechnen", "betriebssystem": "Windows", "stufe1": "Material", "stufe2": "Rabatt fehlt", "stufe3": "Im Auftrag", "stufe4": "Kundenrabatt gilt nur für Leistungen", "frage": "Warum wird der Rabatt nicht auf Material gewährt?", "stichworte": "rabatt material kundenrabatt nachlass", "ursache": "Material und Leistungen haben getrennte Rabattfelder.", "pruefen": "Kunden › Konditionen öffnen\nBeide Rabattfelder vergleichen", "loesung": "Kunden öffnen › Reiter Konditionen\nRabatt für Material eintragen\nIm Auftrag „Preise neu berechnen“ wählen", "hinweis": "Positionsrabatte überschreiben Kundenrabatte."}, "erstellt": "2026-09-18T04:00:00Z"}, {"id": "SUP-020", "name": "Zuschläge für Nacht und Wochenende fehlen", "kategorie": "Auftragsdetails: Material und Leistungen erfassen und berechnen", "bezeichnung": "Nacht-, Sonntags- und Feiertagsstunden werden zum normalen Stundensatz berechnet.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Abrechnen", "betriebssystem": "Windows", "stufe1": "Leistungen", "stufe2": "Zuschlag fehlt (Nacht, Wochenende, Feiertag)", "stufe3": "Nach Zeitübernahme", "stufe4": "Keine Zuschlagsregel für die Leistungsart", "frage": "Warum werden keine Nachtzuschläge berechnet?", "stichworte": "zuschlag nacht wochenende feiertag sonntag leistung", "ursache": "Für die Leistungsart ist keine Zuschlagsregel hinterlegt.", "pruefen": "Zeitraum der Buchung prüfen (Uhrzeit, Wochentag)\nStammdaten › Leistungsarten › Zuschläge öffnen\nFeiertagskalender des Bundeslands prüfen", "loesung": "Stammdaten › Leistungsarten › Zuschläge öffnen\nZuschläge mit Uhrzeit und Prozentsatz anlegen\nIm Auftrag Zeiten erneut übernehmen", "hinweis": "Typisch bei Objektschutz und Wachdienst. Zuschläge gelten erst für neue Übernahmen."}, "erstellt": "2026-09-19T03:00:00Z"}, {"id": "SUP-021", "name": "Menge oder Einheit beim Material falsch", "kategorie": "Auftragsdetails: Material und Leistungen erfassen und berechnen", "bezeichnung": "Die Menge im Auftrag passt nicht, weil der Artikel in einer anderen Einheit geführt wird.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Abrechnen", "betriebssystem": "Windows", "stufe1": "Material", "stufe2": "Menge oder Einheit falsch", "stufe3": "Im Auftrag", "stufe4": "Artikel hat Verpackungseinheit statt Stück", "frage": "Warum stimmt die Materialmenge nicht?", "stichworte": "menge einheit material stück paket meter", "ursache": "Der Artikel wird in Paketen geführt, gebucht wurde aber in Stück.", "pruefen": "Artikel › Einheiten öffnen\nUmrechnungsfaktor (z. B. 1 Paket = 100 Stück) prüfen", "loesung": "Artikel › Einheiten öffnen\nVerkaufseinheit prüfen\nPosition im Auftrag mit der richtigen Einheit neu erfassen", "hinweis": "Einheiten nach der ersten Buchung nicht mehr ändern, sondern neuen Artikel anlegen."}, "erstellt": "2026-09-15T09:00:00Z"}, {"id": "SUP-022", "name": "Rechnung nach Versand ändern", "kategorie": "Rechnungen, Gutschriften, Mahnungen und E-Rechnung", "bezeichnung": "Versendete Rechnungen dürfen nicht mehr geändert werden (GoBD). Korrekt ist eine Stornorechnung und danach eine neue Rechnung.", "zusatz": {"produkt": "Fakturo", "wann": "Nach dem Versand", "betriebssystem": "Windows", "fehlercode": "R-100", "stufe1": "Rechnung", "stufe2": "Muss korrigiert w -026", "name": "Schlussrechnung zieht Abschläge nicht ab", "kategorie": "Rechnungen, Gutschriften, Mahnungen und E-Rechnung", "bezeichnung": "Abschlagsrechnungen werden nur abgezogen, wenn sie mit demselben Auftrag verknüpft sind.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Abrechnen", "betriebssystem": "Windows", "stufe1": "Rechnung", "stufe2": "Betrag stimmt nicht", "stufe3": "Schlussrechnung", "stufe4": "Abschläge ohne Auftragsverknüpfung", "frage": "Warum werden Abschlagszahlungen in der Schlussrechnung nicht abgezogen?", "stichworte": "abschlag schlussrechnung abschlagsrechnung teilrechnung", "ursache": "Die Abschlagsrechnungen wurden ohne Auftrag geschrieben.", "pruefen": "Abschlagsrechnungen des Kunden auflisten\nFeld „Auftrag“ in jeder Abschlagsrechnung prüfen", "loesung": "Abschlagsrechnungen öffnen und Auftrag prüfen\nFehlende Verknüpfung über „Auftrag zuordnen“ setzen\nSchlussrechnung neu erzeugen", "hinweis": "Ist die Schlussrechnung versendet, Storno und neue Schlussrechnung."}, "erstellt": "2026-08-31T04:00:00Z"}, {"id": "SUP-027", "name": "Empfangene E-Rechnung lässt sich nicht lesen", "kategorie": "Rechnungen, Gutschriften, Mahnungen und E-Rechnung", "bezeichnung": "Ein Lieferant hat eine XRechnung als XML geschickt. Ohne Import zeigt Windows nur Code.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Empfang", "betriebssystem": "Windows", "stufe1": "E-Rechnung", "stufe2": "Empfangene E-Rechnung nicht lesbar", "stufe3": "Eingangsrechnung", "stufe4": "Nur XML-Datei, kein Sichtbeleg", "frage": "Wie öffne ich eine XRechnung von einem Lieferanten?", "stichworte": "e-rechnung empfangen xml lesen eingangsrechnung xrechnung", "ursache": "Eine reine XRechnung hat kein PDF. Fakturo erzeugt die Ansicht beim Import.", "pruefen": "Dateiendung prüfen (.xml)\nEingangsrechnungen › Import nutzen statt Datei doppelklicken", "loesung": "Eingangsrechnungen › Importieren wählen\nXML-Datei auswählen\nFakturo zeigt die Rechnung als lesbaren Beleg", "hinweis": "Seit 20 Verwaltung › Anträge prüfen", "loesung": "Verwaltung › Person › Vorgesetzte eintragen\nAntrag unter Verwaltung › Anträge freigeben", "hinweis": "Vertretung einrichten, wenn die vorgesetzte Person im Urlaub ist."}, "erstellt": "2026-06-20T09:00:00Z"}, {"id": "SUP-050", "name": "Kontrollpunkt lässt sich nicht scannen", "kategorie": "Wächterkontrolle: Rundgänge, Kontrollpunkte und Alarme", "bezeichnung": "Das NFC-Tag wird nicht gelesen. Häufig ist NFC am Handy aus, eine dicke Hülle stört oder das Tag ist beschädigt.", "zusatz": {"produkt": "Fakturo Rundgang", "wann": "Beim Rundgang", "betriebssystem": "Android", "geraet": "NFC-Kontrollpunkt", "stufe1": "Kontrollpunkt", "stufe2": "Scan funktioniert nicht", "stufe3": "Wachperson vor Ort", "stufe4": "Handy liest gar kein Tag oder nur dieses nicht", "frage": "Warum kann ich einen Kontrollpunkt nicht scannen?", "stichworte": "kontrollpunkt scannen nfc tag lesen checkpoint", "ursache": "NFC aus, Hülle stört oder Tag beschädigt.", "pruefen": "Prüfen, ob andere Tags gelesen werden\nNFC-Einstellung am Handy prüfen\nTag auf Beschädigung ansehen lassen", "loesung": "NFC in den Handy-Einstellungen einschalten\nHandy mit der Rückseite mittig an das Tag halten, Hülle abnehmen\nGeht es nicht: Punkt in der App als „nicht lesbar“ melden, mit Foto", "hinweis": "Liest das Handy kein Tag: Handyproblem. Nur dieses Tag: Tag ersetzen."}, "erstellt": "2026-06-21T08:00:00Z"}, {"id": "SUP-051", "name": "Rundgang als verspätet markiert", "kategorie": "Wächterkontrolle: Rundgänge, Kontrollpunkte und Alarme", "bezeichnung": "Das Zeitfenster des Rundgangs hat eine Toleranz von 10 Minuten. Liegt die Handyuhr daneben oder startet der Rundgang zu spät, gilt er als verspätet.", "zusatz": {"produkt": "Fakturo Rundgang", "wann": "Beim Rundgang", "betriebssystem": "Android", "geraet": "Wächter-Smartphone", "stufe1": "Zeitplan", "stufe2": "Rundgang als verspätet markiert", "stufe3": "Leitstelle im Bericht", "stufe4": "Handyuhr weicht ab oder Start nach Toleranz", "frage": "Warum steht mein Rundgang auf verspätet?", "stichworte": "rundgang verspätet zeitfenster toleranz zu spät", "ursache": "Startzeit außerhalb des Zeitfensters.", "pruefen": "Scanzeiten im Bericht ansehen\nUhrzeit-Einstellung am Handy prüfen\nToleranz im Plan prüfen", "loesung": "Uhrzeit am Handy auf automatisch stellen\nIn der Leitstelle Rundgangsplan › Toleranz prüfen\nRundgang innerhalb des Zeitfensters starten", "hinweis": "Toleranzen sind oft im Vertrag mit dem Auftraggeber festgelegt."}, "erstellt": "2026-06-17T07:00:00Z"}, {"id": "SUP-052", "name": "Geplanter Rundgang fehlt in der App", "kategorie": "Wächterkontrolle: Rundgänge, Kontrollpunkte und Alarme", "bezeichnung": "Der Rundgang ist nicht dem Objekt oder der Schicht der Person zugewiesen.", "zusatz": {"produkt": "Fakturo Rundgang", "wann": "Bei Schichtbeginn", "betriebssystem": "Android", "geraet": "Wächter-Smartphone", "stufe1": "Zeitplan", "stufe2": "Rundgang wird nicht angezeigt", "stufe3": "Wachperson vor Ort", "stufe4": "Plan ist der Schicht nicht zugewiesen", "frage": "Warum sehe ich meinen Rundgang nicht in der App?", "stichworte": "rundgang fehlt app nicht sichtbar plan zuweisen", "ursache": "Plan nicht dem Objekt oder der Schicht zugewiesen.", "pruefen": "Leitstelle › Rundgangspläne ansehen\nSchicht der Person im Dienstplan prüfen", "loesung": "Leitstelle › Rundgangspläne öffnen\nObjekt und Schicht zuweisen\nIn der App nach unten ziehen zum Aktualisieren", "hinweis": "Nach Zuweisung in der App aktualisieren."}, "erstellt": "2026-06-13T06:00:00Z"}, {"id": "SUP-053", "name": "Kein Alarm bei ausgelassenem Kontrollpunkt", "kategorie": "Wächterkontrolle: Rundgänge, Kontrollpunkte und Alarme", "bezeichnung": "Für den Rundgang ist keine Benachrichtigung eingerichtet. Ausgelassene Punkte stehen dann nur im Bericht.", "zusatz": {"produkt": "Fakturo Rundgang", "wann": "Beim Rundgang", "betriebssystem": "Web", "stufe1": "Alarme", "stufe2": "Kein Alarm bei verpasstem Punkt", "stufe3": "Leitstelle", "stufe4": "Benachrichtigung im Plan aus", "frage": "Warum bekomme ich keine Meldung, wenn ein Kontrollpunkt fehlt?", "stichworte": "alarm benachrichtigung ausgelassen kontrollpunkt eskalation leitstelle", "ursache": "Keine Benachrichtigung eingerichtet.", "pruefen": "Plan › Benachrichtigungen öffnen\nEmpfänger und Kanal prüfen", "loesung": "Leitstelle › Rundgangsplan › Benachrichtigungen öffnen\n„Kontrollpunkt verpasst“ aktivieren\nEmpfänger (E-Mail, SMS oder Leitstelle) eintragen", "hinweis": "Sicherheitsrelevant. Bei Unklarheit sofort an den 2nd Level."}, "erstellt": "2026-06-09T05:00:00Z"}, {"id": "SUP-054", "name": "Totmann-Alarm löst ständig aus", "kategorie": "Wächterkontrolle: Rundgänge, Kontrollpunkte und Alarme", "bezeichnung": "Der Alleinarbeiter-Schutz meldet Alarm, wenn sich das Handy eine Zeit lang nicht bewegt. Im Fahrzeug oder beim Sitzen ist die Einstellung oft zu streng.", "zusatz": {"produkt": "Fakturo Rundgang", "wann": "Beim Rundgang", "betriebssystem": "Android", "geraet": "Wächter-Smartphone", "stufe1": "Alarme", "stufe2": "Fehlalarme", "stufe3": "Leitstelle", "stufe4": "Totmann-Alarm bei Ruhe im Fahrzeug oder beim Sitzen", "frage": "Warum löst der Totmann-Alarm so oft aus?", "stichworte": "totmann alarm alleinarbeiter bewegung lage fehlalarm", "ursache": "Ruhezeit zu kurz eingestellt.", "pruefen": "Alarmprotokoll der letzten Schicht ansehen\nSituation bei den Alarmen erfragen", "loesung": "Leitstelle › Objekt › Alleinarbeiterschutz öffnen\nRuhezeit bis zum Voralarm verlängern, z. B. auf 5 Minuten\nVoralarm auf dem Handy bestätigen lassen statt sofort zu melden", "hinweis": "Den Schutz nie ganz ausschalten, nur anpassen."}, "erstellt": "2026-06-05T04:00:00Z"}, {"id": "SUP-055", "name": "Neuen Kontrollpunkt anlegen", "kategorie": "Wächterkontrolle: Rundgänge, Kontrollpunkte und Alarme", "bezeichnung": "Neue NFC-Tags oder QR-Codes müssen einmal in der App angelernt und einem Objekt zugeordnet werden.", "zusatz": {"produkt": "Fakturo Rundgang", "wann": "Beim Einrichten", "betriebssystem": "Android", "geraet": "NFC-Kontrollpunkt", "stufe1": "Kontrollpunkt", "stufe2": "Neuer Punkt soll angelegt werden", "stufe3": "Objektleitung", "stufe4": "Tag ist noch nicht angelernt", "frage": "Wie lege ich einen neuen Kontrollpunkt an?", "stichworte": "kontrollpunkt anlegen neu tag qr anlernen", "ursache": "Neue Tags kennt das System erst nach dem Anlernen.", "pruefen": "Recht „Kontrollpunkte anlernen“ prüfen\nTag-Typ prüfen (NFC, QR, Barcode)", "loesung": "In der App als Objektleitung „Kontrollpunkte anlernen“ wählen\nTag scannen und Namen vergeben, z. B. „Tor Nord“\nIn der Leitstelle den Punkt in den Rundgangsplan aufnehmen", "hinweis": "Tags gut sichtbar, aber nicht leicht entfernbar anbringen."}, "erstellt": "2026-06-06T03:00:00Z"}, {"id": "SUP-056", "name": "Scan kommt nicht in der Leitstelle an", "kategorie": "Wächterkontrolle: Rundgänge, Kontrollpunkte und Alarme", "bezeichnung": "Die Wachperson hat gescannt, aber in der Leitstelle fehlt der Punkt.", "zusatz": {"produkt": "Fakturo Rundgang", "wann": "Beim Rundgang", "betriebssystem": "Android", "geraet": "Wächter-Smartphone", "stufe1": "Kontrollpunkt", "stufe2": "Scan kommt nicht in der Leitstelle an", "stufe3": "Leitstelle", "stufe4": "App zeigt Scans in der Warteschlange", "frage": "Warum sieht die Leitstelle meine Scans nicht?", "stichworte": "scan leitstelle fehlt netz warteschlange", "ursache": "Kein Netz am Objekt. Scans werden gespeichert und später gesendet.", "pruefen": "Warteschlange in der App ansehen\nMobilfunkempfang am Objekt erfragen", "loesung": "In der App die Warteschlange öffnen\nOrt mit Empfang aufsuchen\n„Jetzt senden“ tippen", "hinweis": "Für Objekte ohne Netz: WLAN-Punkt oder Offline-Modus mit Abgleich bei Schichtende."}, "erstellt": "2026-06-02T09:00:00Z"}, {"id": "SUP-057", "name": "Rundgang wird zur falschen Zeit erzeugt", "kategorie": "Wächterkontrolle: Rundgänge, Kontrollpunkte und Alarme", "bezeichnung": "Am Wochenende oder Feier <script>
const RAW = JSON.parse(document.getElementById('daten').textContent);
const DATA = RAW.eintraege;
const KATS = RAW.kategorien;
const OFT = RAW.oft_gesucht;
const KURZ = Object.fromEntries(KATS.map(k=>[k.name,k.kurzname]));
const PRODUKTE = Object.fromEntries(RAW.programme.map(p=>[p.name,{k:p.kuerzel,info:p.art,text:p.beschreibung,version:p.version}]));
const pname = p => p==="alle" ? "Alle Programme" : (p||"Allgemein");
const ICONS = {
 K01:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
 K02:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9zM9 11h6M9 15h4"/>',
 K03:'<path d="M3 7l9-4 9 4-9 4-9-4zM3 7v10l9 4 9-4V7M12 11v10"/>',
 K04:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
 K05:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 K06:'<rect x="6" y="3" width="12" height="18" rx="2"/><rect x="9" y="6" width="6" height="4"/><path d="M9 15h6M9 18h6"/>',
 K07:'<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2M10 9l2 2 3-3"/>',
 K08:'<circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h6a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h6"/>',
 K09:'<path d="M5 4h11a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2z"/><path d="M5 18a2 2 0 0 1 2-2h11M9 8h5"/>',
 K10:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'
};
const icon = id => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[id]||''}</svg>`;
// Zusatzfelder, aus denen geführte Fragen werden (Reihenfolge = Priorität)
// Diagnosepfad: zusatz.stufe1..stufe4 beantworten die vier Fragen der Kategorie (kategorien[].fragen)
const STUFEN = ["stufe1","stufe2","stufe3","stufe4"];
const ANDERS = "__anders__";
const LABEL = {kategorie:"Bereich",stufe1:"Thema",stufe2:"Symptom",stufe3:"Umfang",stufe4:"Befund",produkt:"Programm",wann:"Wann",betriebssystem:"System",geraet:"Gerät",version:"Version",fehlercode:"Fehlercode"};
const INTERN = ["loesung","frage","stichworte","ursache","pruefen","hinweis",...STUFEN];
const showVal = (k,v) => v===ANDERS ? "etwas anderes" : (k==="kategorie" ? (KURZ[v]||v) : v);

const S = {view:"home", q:"", answers:{}, skipped:[], tab:"Alle", detail:null, helpful:null};
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).toLowerCase().replace(/ß/g,'ss').normalize('NFD').replace(/[̀-ͯ]/g,'');
const tokens = q => norm(q).split(/[^a-z0-9]+/).filter(t => t.length >= 2);

/* ---------- Suche ---------- */
function score(e, toks){
  if(!toks.length) return 1;
  const z = e.zusatz || {};
  const fields = [[e.name,3],[z.stichworte||"",2],[e.kategorie,2],[z.frage||"",2],[z.produkt||"",2],[e.bezeichnung,1],
    [Object.entries(z).filter(([k])=>!INTERN.includes(k)).map(([,v])=>v).join(' '),1]];
  let s = 0, hit = 0;
  for(const t of toks){
    let best = 0;
    for(const [f,w] of fields){
      const words = norm(f).split(/[^a-z0-9]+/);
      if(words.some(x => x.startsWith(t)) || (t.length >= 4 && norm(f).includes(t))) best = Math.max(best, w);
    }
    if(best){ s += best; hit++; }
  }
  return hit >= Math.ceil(toks.length/2) ? s + hit*2 : 0;
}
function search(q=S.q){
  const toks = tokens(q);
  return DATA.map(e => ({e, s:score(e,toks)})).filter(r => r.s>0).sort((a,b)=>b.s-a.s).map(r=>r.e);
}
function applyAnswers(list){
  return list.filter(e => Object.entries(S.answers).every(([k,v]) => { const x = k==="kategorie" ? e.kategorie : (e.zusatz||{})[k]; return x===undefined || x==="alle" || x===v; }));
}
function nextQuestion(list){
  if(!list.length) return null;
  const c0={}; list.forEach(e=>c0[e.kategorie]=(c0[e.kategorie]||0)+1);
  const kats=Object.keys(c0);
  if(kats.length>1){
    if(S.answers.kategorie || S.skipped.includes("kategorie")) return null;
    return {key:"kategorie",q:"Welcher Bereich ist betroffen?",opts:Object.entries(c0).sort((a,b)=>b[1]-a[1]),vor:true};
  }
  const kat = KATS.find(k=>k.name===kats[0]);
  for(let i=0;i<4;i++){
    const key=STUFEN[i];
    if(key in S.answers || S.skipped.includes(key)) continue;
    const c={}; list.forEach(e=>{const v=(e.zusatz||{})[key]; if(v) c[v]=(c[v]||0)+1;});
    const opts=Object.entries(c).sort((a,b)=>b[1]-a[1]);
    if(!opts.length) continue;
    return {key,q:kat?.fragen?.[i]||"Was trifft zu?",opts,nr:i+1,confirm:opts.length===1};
  }
  return null;
}
function hl(text, toks){
  let out = esc(text);
  if(!toks.length) return out;
  return out.replace(/[\p{L}\p{N}]+/gu, w => toks.some(t => norm(w).startsWith(t)) ? `<b>${w}</b>` : w);
}

/* ---------- Autovervollständigung ---------- */
function suggestions(q){
  const n = norm(q.trim());
  if(!n) return DATA.slice().sort((a,b)=>b.erstellt.localeCompare(a.erstellt)).slice(0,5).map(e => ({t:e.name,ico:"⟳",typ:"Neu",kind:"entry",id:e.id}));
  const out = [];
  Object.keys(PRODUKTE).forEach(p => { if(norm(p).includes(n)) out.push({t:p,ico:"▣",typ:"Produkt",kind:"prod"}); });
  KATS.forEach(k => { if(norm(k.name).includes(n) || norm(k.kurzname).startsWith(n)) out.push({t:k.name,ico:"#",typ:"Bereich",kind:"kat"}); });
  const toks = tokens(q);
  search(q).slice(0,6).forEach(e => out.push({t:e.zusatz?.frage || e.name, ico:"⌕", typ:KURZ[e.kategorie]||"", kind:"q2", e}));
  if(!toks.length) return out.slice(0,7);
  return out.slice(0,7);
}
function boldPart(t, q){
  const i = norm(t).indexOf(norm(q.trim()));
  if(!q.trim() || i<0) return `<b>${esc(t)}</b>`;
  const L = q.trim().length;
  return `${esc(t.slice(0,i))}<span style="color:var(--fg)">${esc(t.slice(i,i+L))}</span><b>${esc(t.slice(i+L))}</b>`;
}
function bindSearch(root){
  const box = root.querySelector('.search'), inp = box.querySelector('input'), ac = box.querySelector('.ac');
  let sel = -1, items = [];
  const close = () => { ac.hidden = true; box.classList.remove('open'); sel=-1; };
  const draw = () => {
    items = suggestions(inp.value);
    if(!items.length){ close(); return; }
    ac.innerHTML = `<hr>` + items.map((s,i)=>`<button type="button" role="option" aria-selected="${i===sel}" data-i="${i}">
      <span class="ico">${s.ico}</span><span class="txt">${boldPart(s.t, inp.value)}</span><span class="typ">${esc(s.typ)}</span></button>`).join('');
    ac.hidden = false; box.classList.add('open');
  };
  const pick = s => {
    close();
    if(s.kind==="prod"){ startProduct(s.t); return; }
    if(s.kind==="entry"){ openDetail(s.id); return; }
    if(s.kind==="kat"){ startCategory(s.t); return; }
    if(s.kind==="q2"){ openDetail(s.e.id); return; }
    runSearch(s.t);
  };
  inp.addEventListener('input', ()=>{ sel=-1; draw(); });
  inp.addEventListener('focus', draw);
  inp.addEventListener('keydown', ev => {
    if(ev.key==="ArrowDown"||ev.key==="ArrowUp"){ if(ac.hidden) draw(); ev.preventDefault(); const n = items.length+1; sel = ((sel+1+(ev.key==="ArrowDown"?1:-1)) % n + n) % n - 1; draw(); }
    else if(ev.key==="Enter"){ ev.preventDefault(); if(sel>=0 && items[sel]) pick(items[sel]); else { close(); runSearch(inp.value); } }
    else if(ev.key==="Escape") close();
  });
  ac.addEventListener('mousedown', ev => { const b = ev.target.closest('button'); if(b){ ev.preventDefault(); pick(items[+b.dataset.i]); } });
  inp.addEventListener('blur', ()=> setTimeout(close,120));
  box.querySelector('.go')?.addEventListener('click', ()=>{ close(); runSearch(inp.value); });
  box.querySelector('.clear').addEventListener('click', ()=>{ inp.value=''; inp.focus(); draw(); });
}
const searchHTML = (val, id) => `<div class="search" role="combobox" aria-haspopup="listbox">
  <div class="sbox"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
  <input id="${id}" type="text" autocomplete="off" placeholder="Beschreibe dein Problem, z. B. „Terminal offline“" value="${esc(val)}" aria-label="Problem suchen">
  <button class="clear" type="button" aria-label="Eingabe löschen">×</button><button class="go" type="button">Suchen</button></div>
  <div class="ac" role="listbox" hidden></div></div>`;

/* ---------- Aktionen ---------- */
function runSearch(q){ S.q=q.trim(); S.answers={}; S.skipped=[]; S.tab="Alle"; S.view="results"; render(); }
function startCategory(k){ S.q=""; S.answers={kategorie:k}; S.skipped=[]; S.tab="Alle"; S.view="results"; render(); window.scrollTo({top:0}); }
function startProduct(p){ S.q=""; S.answers={produkt:p}; S.skipped=[]; S.tab="Alle"; S.view="results"; render(); }
function openDetail(id){ S.detail=id; S.helpful=null; S.view="detail"; render(); window.scrollTo({top:0}); }
function goHome(){ S.view="home"; S.q=""; S.answers={}; S.skipped=[]; render(); }

/* ---------- Ansichten ---------- */
function render(){
  if(S.view==="home") renderHome();
  else if(S.view==="results") renderResults();
  else renderDetail();
}
function renderHome(){
  app.innerHTML = `<section class="home">
    <button class="logo" id="lg" aria-label="Startseite">Fakturo<i> Hilfe</i><span class="dot"></span></button>
    <p class="lead">Supporthilfe für Rechnungssoftware, Zeiterfassung, Rundgänge und Wachbuch. Vier Fragen führen zum bekannten Fall.</p>
    ${searchHTML("", "q-home")}
    <span class="label">Oft gesucht</span>
    <div class="trend">${OFT.map(t=>`<button class="chip" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div>
    <span class="label">Oder wähle einen Bereich</span>
    <div class="katgrid">${KATS.map(k=>`<button class="kat" data-k="${esc(k.name)}"><span class="ki">${icon(k.id)}</span><strong>${esc(k.name)}</strong></button>`).join('')}</div>
  </section>`;
  bindSearch(app);
  app.querySelectorAll('.kat').forEach(b=>b.onclick=()=>startCategory(b.dataset.k));
  app.querySelectorAll('.trend .chip').forEach(b=>b.onclick=()=>runSearch(b.dataset.t));
}
function topBar(){ return `<header class="top"><button class="logo" id="lg" aria-label="Startseite">Fakturo<i> Hilfe</i><span class="dot"></span></button>${searchHTML(S.q,"q-top")}</header>`; }

function renderResults(){
  const toks = tokens(S.q);
  const base = search();
  const narrowed = applyAnswers(base);
  const cats = {}; narrowed.forEach(e=>cats[e.kategorie]=(cats[e.kategorie]||0)+1);
  if(S.tab!=="Alle" && !cats[S.tab]) S.tab="Alle";
  const list = S.tab==="Alle" ? narrowed : narrowed.filter(e=>e.kategorie===S.tab);
  const nq = nextQuestion(list);
  const doneQ = STUFEN.filter(k=>k in S.answers || S.skipped.includes(k)).length;
  const showBest = list.length && !nq;

  const answered = Object.entries(S.answers).map(([k,v])=>`<button class="chip on" data-rm="${k}" title="Antwort entfernen"><small>${LABEL[k]}:</small> ${esc(showVal(k,v))} <span class="x">×</span></button>`).join('')
    + S.skipped.map(k=>`<button class="chip" data-unskip="${k}" title="Frage wieder anzeigen"><small>${LABEL[k]}:</small> weiß nicht <span class="x">×</span></button>`).join('');

  const guide = nq ? `<section class="guide" aria-label="Problem eingrenzen">
      <div class="steps" aria-hidden="true">${nq.vor?'':[0,1,2,3].map(i=>`<i class="${i<doneQ?'done':''}"></i>`).join('')}<span class="label" style="margin-left:6px">${nq.vor?'Vorab':`Frage ${nq.nr} von 4`} · ${list.length} ${list.length===1?'möglicher Fall':'mögliche Fälle'}</span></div>
      <div class="q">${esc(nq.q)}</div>
      ${nq.confirm?`<p class="qhint">${list.length===1?"Nur ein bekannter Fall passt noch. Bestätige den Befund mit dem Kunden.":"Alle passenden Fälle haben dieses Merkmal. Frag nach, ob es stimmt."}</p>`:''}
      <div class="row">${nq.opts.map(([v,c])=>`<button class="chip${nq.confirm?' yes':''}" data-ans="${nq.key}" data-v="${esc(v)}">${nq.confirm?'✓ ':''}${esc(nq.key==="kategorie"?(KURZ[v]||v):v)}${nq.confirm?'':` <small>${c}</small>`}</button>`).join('')}${nq.vor?'':`<button class="chip other" data-ans="${nq.key}" data-v="${ANDERS}">${nq.confirm?'Nein, etwas anderes':'Etwas anderes'}</button>`}<button class="skip" data-skip="${nq.key}">Weiß nicht</button></div>
      ${answered?`<div class="answered">${answered}</div>`:''}
    </section>` : (answered ? `<div class="answered"><span class="label">Diagnosepfad</span>${answered}</div>` : '');

  const best = showBest ? (()=>{ const e=list[0]; const steps=(e.zusatz?.loesung||"").split("\n").filter(Boolean);
    return `<section class="best"><div class="bh">✓ ${list.length===1?'Passende Lösung gefunden':'Wahrscheinlichste Lösung'}</div><div class="bb">
      <div class="crumb">${esc(pname(e.zusatz?.produkt))} › ${esc(KURZ[e.kategorie]||e.kategorie)}</div>
      <h3>${esc(e.name)}</h3><p style="margin:0">${esc(e.bezeichnung)}</p>
      ${e.zusatz?.ursache?`<p class="ursache"><b>Ursache:</b> ${esc(e.zusatz.ursache)}</p>`:''}
      ${steps.length?`<span class="label">Lösung</span><ol>${steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:''}
      <button class="linkbtn" data-open="${e.id}">Ganze Lösung ansehen ›</button></div></section>`; })() : '';

  const resHTML = e => { const z=e.zusatz||{};
    const tags = ["wann","geraet","betriebssystem","fehlercode"].filter(k=>z[k]).map(k=>`<span class="tag">${LABEL[k]} ${esc(z[k])}</span>`).join('');
    return `<article class="res"><div class="crumb"><span class="fav">${PRODUKTE[z.produkt]?.k||'F'}</span><span>${esc(pname(z.produkt))} › ${esc(KURZ[e.kategorie]||e.kategorie)}</span><span class="id">${e.id}</span></div>
      <h3><button data-open="${e.id}">${hl(e.name,toks)}</button></h3><p>${hl(e.bezeichnung,toks)}</p><div class="meta">${tags}</div></article>`; };

  const rest = showBest ? list.slice(1) : list;
  const paaSrc = (rest.length>3 ? rest.slice(2,6) : DATA.filter(e=>!list.includes(e) && (S.answers.kategorie||list[0]?.kategorie ? e.kategorie===(S.answers.kategorie||list[0]?.kategorie) : true)).slice(0,4));
  const paa = paaSrc.length ? `<section class="paa"><h2>Ähnliche Fragen</h2>${paaSrc.map(e=>`<details><summary>${esc(e.zusatz?.frage||e.name)}</summary><div class="ans">${esc(e.bezeichnung)}<button class="linkbtn" data-open="${e.id}">Zur Lösung: ${esc(e.name)} ›</button></div></details>`).join('')}</section>` : '';
  const shown = rest.filter(e=>!paaSrc.includes(e));
  const results = shown.slice(0,2).map(resHTML).join('') + paa + shown.slice(2).map(resHTML).join('');

  const anders = Object.values(S.answers).includes(ANDERS);
  const empty = !list.length && anders ? `<div class="empty"><strong>Kein bekannter Fall für diesen Diagnosepfad.</strong><br>Nimm eine Antwort zurück, um andere Fälle zu sehen, oder <button class="linkbtn" data-ticket="1">gib den Fall mit dem Pfad an den 2nd Level</button>.</div>`
    : !list.length ? `<div class="empty"><strong>Keine Lösung zu „${esc(S.q)}“ gefunden.</strong><br>Versuche andere Wörter, entferne eine Angabe oder <button class="linkbtn" data-ticket="1">frag den Support direkt</button>.</div>` : '';

  const prod = S.answers.produkt || (list.length && list.every(e=>e.zusatz?.produkt===list[0].zusatz?.produkt) ? list[0].zusatz?.produkt : null);
  const side = prod && PRODUKTE[prod] ? (()=>{ const p=PRODUKTE[prod]; const all=DATA.filter(e=>e.zusatz?.produkt===prod);
      const c={}; all.forEach(e=>c[e.kategorie]=(c[e.kategorie]||0)+1); const max=Math.max(...Object.values(c));
      return `<aside class="side"><div class="ph"><span class="pi">${p.k}</span><div><h2 style="margin:0">${esc(prod)}</h2><p>${esc(p.info)}</p></div></div>
        <p>${esc(p.text)}</p><dl class="kv"><dt>Aktuelle Version</dt><dd>${esc(p.version)}</dd><dt>Bekannte Probleme</dt><dd>${all.length}</dd></dl>
        <div style="display:flex;flex-direction:column;gap:6px"><span class="label">Häufigste Themen</span>${Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar"><span>${esc(KURZ[k]||k)}</span><span><i style="width:${v/max*100}%"></i></span><span>${v}</span></div>`).join('')}</div>
        <button class="btn" data-ticket="1">Support kontaktieren</button></aside>`; })()
    : S.answers.kategorie ? (()=>{ const k=KATS.find(x=>x.name===S.answers.kategorie); return `<aside class="side"><div class="ph"><span class="pi">${icon(k?.id)}</span><div><h2 style="margin:0">${esc(k?.kurzname||'')}</h2><p>${esc(k?.name||'')}</p></div></div>
        <dl class="kv"><dt>Programm</dt><dd>${esc(pname(k?.programm))}</dd><dt>Bekannte Probleme</dt><dd>${DATA.filter(e=>e.kategorie===k?.name).length}</dd></dl>
        <p>Vier Fragen führen zum Fall: Thema, Symptom, Umfang und Befund. Passt keine Antwort, wähle „Etwas anderes“.</p><button class="btn" data-ticket="1">Support kontaktieren</button></aside>`; })()
    : `<aside class="side"><h2>So funktioniert die Suche</h2><p>Gib ein, was der Kunde meldet, und beantworte die vier Fragen über den Ergebnissen. Jede Antwort grenzt die Fälle ein. Mit „Weiß nicht“ überspringst du eine Frage, mit „Etwas anderes“ landest du beim 2nd Level.</p></aside>`;

  app.innerHTML = topBar() + `<nav class="tabs">${["Alle",...Object.keys(cats).sort()].map(t=>`<button class="${S.tab===t?'on':''}" data-tab="${esc(t)}">${esc(KURZ[t]||t)} <small>${t==="Alle"?narrowed.length:cats[t]}</small></button>`).join('')}</nav>
    <div class="cols"><div class="main"><div class="stats">${list.length} ${list.length===1?'Lösung':'Lösungen'}${S.q?` zu „${esc(S.q)}“`:''}${Object.keys(S.answers).length?' mit deinen Angaben':''}</div>
    ${guide}${best}${results}${empty}</div>${side}</div>`;
  bindSearch(app);
  bindCommon();
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render();});
  app.querySelectorAll('[data-ans]').forEach(b=>b.onclick=()=>{S.answers[b.dataset.ans]=b.dataset.v;render();});
  app.querySelectorAll('[data-skip]').forEach(b=>b.onclick=()=>{S.skipped.push(b.dataset.skip);render();});
  app.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{delete S.answers[b.dataset.rm];render();});
  app.querySelectorAll('[data-unskip]').forEach(b=>b.onclick=()=>{S.skipped=S.skipped.filter(k=>k!==b.dataset.unskip);render();});
}
function bindCommon(){
  app.querySelector('#lg').onclick = goHome;
  app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDetail(b.dataset.open));
  app.querySelectorAll('[data-ticket]').forEach(b=>b.onclick=()=>{ S.detail=null; S.helpful="nein"; S.view="detail"; render(); });
}
function renderDetail(){
  const e = DATA.find(x=>x.id===S.detail);
  const z = e?.zusatz || {};
  const steps = (z.loesung||"").split("\n").filter(Boolean);
  const pruef = (z.pruefen||"").split("\n").filter(Boolean);
  const kat = KATS.find(k=>k.name===e?.kategorie);
  const pfad = STUFEN.map((k,i)=>[kat?.fragen?.[i]||LABEL[k], z[k]]).filter(([,a])=>a);
  const facts = Object.entries(z).filter(([k])=>!INTERN.includes(k));
  const angaben = Object.entries(S.answers).map(([k,v])=>`${LABEL[k]}: ${showVal(k,v)}`).join("\n");
  const ticketText = `${e?`Lösung „${e.name}“ (${e.id}) hat nicht geholfen.`:`Keine passende Lösung gefunden.`}\n${S.q?`Suche: ${S.q}\n`:''}${angaben}\n\nWas ist noch passiert?\n`;
  const ticket = S.helpful==="nein" ? `<section class="box"><h2>Support-Anfrage</h2>
      <p style="margin:0 0 10px">Deine Angaben aus der Suche sind schon eingetragen.</p>
      <form id="tf"><label class="label" for="tt">Beschreibung</label><textarea id="tt">${esc(ticketText)}</textarea>
      <div class="helpful" style="margin-top:10px"><button class="btn pri" type="submit">Anfrage senden</button><span id="tmsg"></span></div></form></section>` : '';
  app.innerHTML = topBar() + `<article class="detail">
    <button class="back" id="bk">‹ Zurück zu den Ergebnissen</button>
    ${e?`<div class="crumb"><span class="fav">${PRODUKTE[z.produkt]?.k||'F'}</span>${esc(pname(z.produkt))} › ${esc(e.kategorie)} <span class="id">${e.id}</span></div>
    <h1>${esc(e.name)}</h1><p class="lead">${esc(e.bezeichnung)}</p>
    ${pfad.length?`<section class="box"><h2>Diagnosepfad</h2><ol class="pfad">${pfad.map(([q,a])=>`<li><span>${esc(q)}</span><strong>${esc(a)}</strong></li>`).join('')}</ol></section>`:''}
    ${z.ursache?`<section class="box"><h2>Ursache</h2><p style="margin:0">${esc(z.ursache)}</p></section>`:''}
    ${pruef.length?`<section class="box"><h2>Im Gespräch prüfen</h2><ul class="check">${pruef.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></section>`:''}
    ${steps.length?`<section class="box"><h2>Lösung in ${steps.length} Schritten</h2><ol class="solve">${steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></section>`:''}
    ${z.hinweis?`<section class="box note"><h2>Hinweis für den Support</h2><p style="margin:0">${esc(z.hinweis)}</p></section>`:''}
    ${facts.length?`<section class="box"><h2>Gilt für</h2><dl class="kv">${facts.map(([k,v])=>`<dt>${esc(LABEL[k]||k)}</dt><dd>${esc(k==="produkt"?pname(v):v)}</dd>`).join('')}</dl></section>`:''}
    <div class="helpful"><strong>Hat das geholfen?</strong>
      <button class="btn ${S.helpful==='ja'?'pri':''}" id="hy">Ja</button><button class="btn ${S.helpful==='nein'?'pri':''}" id="hn">Nein, Support fragen</button>
      ${S.helpful==='ja'?'<span class="okmsg">Danke! Das hilft uns, die Lösungen zu verbessern.</span>':''}</div>`
    :`<h1>Support fragen</h1>`}
    ${ticket}
    ${e?`<details class="raw"><summary>Eintrag als JSON ansehen</summary><pre class="json">${esc(JSON.stringify(e,null,2))}</pre></details>`:''}
  </article>`;
  bindSearch(app); bindCommon();
  app.querySelector('#bk').onclick=()=>{ S.view = (S.q||Object.keys(S.answers).length)?"results":"home"; render(); };
  app.querySelector('#hy')?.addEventListener('click',()=>{S.helpful='ja';render();});
  app.querySelector('#hn')?.addEventListener('click',()=>{S.helpful='nein';render();});
  app.querySelector('#tf')?.addEventListener('submit',ev=>{ev.preventDefault();document.getElementById('tmsg').innerHTML='<span class="okmsg">Anfrage T-1042 angelegt (Mockup, nichts wurde gesendet).</span>';});
}
render();
</script>

</html>
