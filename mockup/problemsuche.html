const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).toLowerCase().replace(/ß/g,'ss').normalize('NFD').replace(/[̀-ͯ]/g,'');
const tokens = q => norm(q).split(/[^a-z0-9]+/).filter(t => t.length >= 2);

/* ---------- Suche ---------- */
function score(e, toks){
  if(!toks.length) return 1;
  const z = e.zusatz || {};
  const fields = [[e.name,3],[z.fehlercode||"",4],[z.stichworte||"",2],[e.kategorie,2],[z.frage||"",2],[z.produkt||"",2],[e.bezeichnung,1],
    [Object.entries(z).filter(([k])=>!INTERN.includes(k)).map(([,v])=>v).join(' '),1]];
  let s = 0, hit = 0;
  for(const t of toks){
    let best = 0;
    for(const [f,w] of fields){
      const words = norm(f).split(/[^a-z0-9]+/);
      if(words.some(x => x.startsWith(t)) || (t.length >= 4 && norm(f).includes(t))) best = Math.max(best, w);
    }
    if(best){ s += best; hit++; }
  }
  return hit >= Math.ceil(toks.length/2) ? s + hit*2 : 0;
}
function search(q=S.q){
  const toks = tokens(q);
  return DATA.map(e => ({e, s:score(e,toks)})).filter(r => r.s>0).sort((a,b)=>b.s-a.s).map(r=>r.e);
}
function applyAnswers(list){
  return list.filter(e => Object.entries(S.answers).every(([k,v]) => { const x = k==="kategorie" ? e.kategorie : (e.zusatz||{})[k]; return x===undefined || x==="alle" || x===v; }));
}
function nextQuestion(list){
  if(!list.length) return null;
  const c0={}; list.forEach(e=>c0[e.kategorie]=(c0[e.kategorie]||0)+1);
  const kats=Object.keys(c0);
  if(kats.length>1){
    if(S.answers.kategorie || S.skipped.includes("kategorie")) return null;
    return {key:"kategorie",q:"Bereich?",opts:Object.entries(c0).sort((a,b)=>b[1]-a[1]),vor:true};
  }
  const kat = KATS.find(k=>k.name===kats[0]);
  for(let i=0;i<4;i++){
    const key=STUFEN[i];
    if(key in S.answers || S.skipped.includes(key)) continue;
    const c={}; list.forEach(e=>{const v=(e.zusatz||{})[key]; if(v) c[v]=(c[v]||0)+1;});
    const opts=Object.entries(c).sort((a,b)=>b[1]-a[1]);
    if(!opts.length) continue;
    return {key,q:kat?.fragen?.[i]||"Was trifft zu?",opts,nr:i+1,confirm:opts.length===1};
  }
  return null;
}
function hl(text, toks){
  let out = esc(text);
  if(!toks.length) return out;
  return out.replace(/[\p{L}\p{N}]+/gu, w => toks.some(t => norm(w).startsWith(t)) ? `<b>${w}</b>` : w);
}

/* ---------- Autovervollständigung ---------- */
function suggestions(q){
  const n = norm(q.trim());
  if(!n) return DATA.slice().sort((a,b)=>b.erstellt.localeCompare(a.erstellt)).slice(0,5).map(e => ({t:e.name,ico:"⟳",typ:e.id,kind:"entry",id:e.id}));
  const out = [];
  DATA.forEach(e => { const fc=e.zusatz?.fehlercode; if(fc && norm(fc).startsWith(n) && !out.some(o=>o.t===fc)) out.push({t:fc,ico:"!",typ:"Code",kind:"code"}); });
  Object.keys(PRODUKTE).forEach(p => { if(norm(p).includes(n)) out.push({t:p,ico:"▣",typ:"Programm",kind:"prod"}); });
  KATS.forEach(k => { if(norm(k.name).includes(n) || norm(k.kurzname).startsWith(n)) out.push({t:k.name,ico:"#",typ:"Bereich",kind:"kat"}); });
  search(q).slice(0,6).forEach(e => out.push({t:e.name, ico:"⌕", typ:e.id, kind:"q2", e}));
  return out.slice(0,8);
}
function boldPart(t, q){
  const i = norm(t).indexOf(norm(q.trim()));
  if(!q.trim() || i<0) return `<b>${esc(t)}</b>`;
  const L = q.trim().length;
  return `${esc(t.slice(0,i))}<span style="color:var(--fg)">${esc(t.slice(i,i+L))}</span><b>${esc(t.slice(i+L))}</b>`;
}
function bindSearch(root){
  const box = root.querySelector('.search'), inp = box.querySelector('input'), ac = box.querySelector('.ac');
  let sel = -1, items = [];
  const close = () => { ac.hidden = true; box.classList.remove('open'); sel=-1; };
  const draw = () => {
    items = suggestions(inp.value);
    if(!items.length){ close(); return; }
    ac.innerHTML = `<hr>` + items.map((s,i)=>`<button type="button" role="option" aria-selected="${i===sel}" data-i="${i}">
      <span class="ico">${s.ico}</span><span class="txt">${boldPart(s.t, inp.value)}</span><span class="typ">${esc(s.typ)}</span></button>`).join('');
    ac.hidden = false; box.classList.add('open');
  };
  const pick = s => {
    close();
    if(s.kind==="prod"){ startProduct(s.t); return; }
    if(s.kind==="entry"){ openDetail(s.id); return; }
    if(s.kind==="kat"){ startCategory(s.t); return; }
    if(s.kind==="q2"){ openDetail(s.e.id); return; }
    runSearch(s.t);
  };
  inp.addEventListener('input', ()=>{ sel=-1; draw(); });
  inp.addEventListener('focus', draw);
  inp.addEventListener('keydown', ev => {
    if(ev.key==="ArrowDown"||ev.key==="ArrowUp"){ if(ac.hidden) draw(); ev.preventDefault(); const n = items.length+1; sel = ((sel+1+(ev.key==="ArrowDown"?1:-1)) % n + n) % n - 1; draw(); }
    else if(ev.key==="Enter"){ ev.preventDefault(); if(sel>=0 && items[sel]) pick(items[sel]); else { close(); runSearch(inp.value); } }
    else if(ev.key==="Escape") close();
  });
  ac.addEventListener('mousedown', ev => { const b = ev.target.closest('button'); if(b){ ev.preventDefault(); pick(items[+b.dataset.i]); } });
  inp.addEventListener('blur', ()=> setTimeout(close,120));
  box.querySelector('.go')?.addEventListener('click', ()=>{ close(); runSearch(inp.value); });
  box.querySelector('.clear').addEventListener('click', ()=>{ inp.value=''; inp.focus(); draw(); });
}
const searchHTML = (val, id) => `<div class="search" role="combobox" aria-haspopup="listbox">
  <div class="sbox"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
  <input id="${id}" type="text" autocomplete="off" placeholder="Ticketbetreff, Symptom oder Code, z. B. „T-01“" value="${esc(val)}" aria-label="Fall suchen">
  <button class="clear" type="button" aria-label="Eingabe löschen">×</button><button class="go" type="button">Suchen</button></div>
  <div class="ac" role="listbox" hidden></div></div>`;

/* ---------- Aktionen ---------- */
function runSearch(q){ S.q=q.trim(); S.answers={}; S.skipped=[]; S.tab="Alle"; S.view="results"; render(); }
function startCategory(k){ S.q=""; S.answers={kategorie:k}; S.skipped=[]; S.tab="Alle"; S.view="results"; render(); window.scrollTo({top:0}); }
function startProduct(p){ S.q=""; S.answers={produkt:p}; S.skipped=[]; S.tab="Alle"; S.view="results"; render(); }
function openDetail(id){ S.detail=id; S.mode=null; S.mitRueck=false; S.view="detail"; render(); window.scrollTo({top:0}); }
function goHome(){ S.view="home"; S.q=""; S.answers={}; S.skipped=[]; render(); }
function copyText(text, btn){
  const done = ok => { const o=btn.textContent; btn.textContent = ok ? "Kopiert" : "Bitte markieren und kopieren"; setTimeout(()=>btn.textContent=o, 1600); };
  try { navigator.clipboard.writeText(text).then(()=>done(true), ()=>done(false)); } catch(_) { done(false); }
}

/* ---------- Ansichten ---------- */
function render(){
  if(S.view==="home") renderHome();
  else if(S.view==="results") renderResults();
  else renderDetail();
}
const LOGO = `<button class="logo" id="lg" aria-label="Startseite">Fakturo<i> Support</i><span class="dot"></span></button>`;
function renderHome(){
  app.innerHTML = `<section class="home">
    ${LOGO}
    <p class="lead">Interne Supporthilfe für 1st und 2nd Level · ${DATA.length} bekannte Fälle · Fakturo, Zeit, Rundgang, Wachbuch</p>
    ${searchHTML("", "q-home")}
    <span class="label">Häufige Tickets</span>
    <div class="trend">${OFT.map(t=>`<button class="chip" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div>
    <span class="label">Bereich</span>
    <div class="katgrid">${KATS.map(k=>`<button class="kat" data-k="${esc(k.name)}"><span class="ki">${icon(k.id)}</span><strong>${esc(k.name)}</strong></button>`).join('')}</div>
  </section>`;
  bindSearch(app);
  app.querySelectorAll('.kat').forEach(b=>b.onclick=()=>startCategory(b.dataset.k));
  app.querySelectorAll('.trend .chip').forEach(b=>b.onclick=()=>runSearch(b.dataset.t));
}
function topBar(){ return `<header class="top">${LOGO}${searchHTML(S.q,"q-top")}</header>`; }

function renderResults(){
  const toks = tokens(S.q);
  const base = search();
  const narrowed = applyAnswers(base);
  const cats = {}; narrowed.forEach(e=>cats[e.kategorie]=(cats[e.kategorie]||0)+1);
  if(S.tab!=="Alle" && !cats[S.tab]) S.tab="Alle";
  const list = S.tab==="Alle" ? narrowed : narrowed.filter(e=>e.kategorie===S.tab);
  const nq = nextQuestion(list);
  const doneQ = STUFEN.filter(k=>k in S.answers || S.skipped.includes(k)).length;
  const showBest = list.length && !nq;

  const answered = Object.entries(S.answers).map(([k,v])=>`<button class="chip on" data-rm="${k}" title="Antwort entfernen"><small>${LABEL[k]}:</small> ${esc(showVal(k,v))} <span class="x">×</span></button>`).join('')
    + S.skipped.map(k=>`<button class="chip" data-unskip="${k}" title="Frage wieder anzeigen"><small>${LABEL[k]}:</small> unklar <span class="x">×</span></button>`).join('');

  const guide = nq ? `<section class="guide" aria-label="Fall eingrenzen">
      <div class="steps" aria-hidden="true">${nq.vor?'':[0,1,2,3].map(i=>`<i class="${i<doneQ?'done':''}"></i>`).join('')}<span class="label" style="margin-left:6px">${nq.vor?'Vorab':`Stufe ${nq.nr}/4`} · ${list.length} ${list.length===1?'Fall':'Fälle'}</span></div>
      <div class="q">${esc(nq.q)}</div>
      ${nq.confirm?`<p class="qhint">${list.length===1?"Ein Fall übrig. Mit Ticket abgleichen.":"Gilt für alle verbleibenden Fälle. Mit Ticket abgleichen."}</p>`:''}
      <div class="row">${nq.opts.map(([v,c])=>`<button class="chip${nq.confirm?' yes':''}" data-ans="${nq.key}" data-v="${esc(v)}">${nq.confirm?'✓ ':''}${esc(nq.key==="kategorie"?(KURZ[v]||v):v)}${nq.confirm?'':` <small>${c}</small>`}</button>`).join('')}${nq.vor?'':`<button class="chip other" data-ans="${nq.key}" data-v="${ANDERS}">${nq.confirm?'Passt nicht':'Anderes'}</button>`}<button class="skip" data-skip="${nq.key}">Unklar</button></div>
      ${answered?`<div class="answered">${answered}</div>`:''}
    </section>` : (answered ? `<div class="answered"><span class="label">Pfad</span>${answered}</div>` : '');

  const best = showBest ? (()=>{ const e=list[0]; const z=e.zusatz||{}; const steps=lines(z.loesung);
    return `<section class="best"><div class="bh">✓ ${list.length===1?'Fall gefunden':'Wahrscheinlichster Fall'} <span class="id" style="margin-left:auto">${e.id}</span></div><div class="bb">
      <div class="crumb">${esc(pname(z.produkt))} › ${esc(KURZ[e.kategorie]||e.kategorie)}</div>
      <h3>${esc(e.name)}</h3><p class="diag">${esc(e.bezeichnung)}</p>
      ${steps.length?`<span class="label">Lösung</span><ol>${steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:''}
      ${z.eskalation?`<p class="esk"><b>Eskalation:</b> ${esc(z.eskalation)}</p>`:''}
      <button class="linkbtn" data-open="${e.id}">Fall öffnen (Rückfragen, Textbaustein, Begründung) ›</button></div></section>`; })() : '';

  const resHTML = e => { const z=e.zusatz||{};
    const tags = ["fehlercode","wann","geraet","betriebssystem"].filter(k=>z[k]).map(k=>`<span class="tag">${LABEL[k]} ${esc(z[k])}</span>`).join('');
    return `<article class="res"><div class="crumb"><span class="fav">${PRODUKTE[z.produkt]?.k||'F'}</span><span>${esc(pname(z.produkt))} › ${esc(KURZ[e.kategorie]||e.kategorie)}</span><span class="id">${e.id}</span></div>
      <h3><button data-open="${e.id}">${hl(e.name,toks)}</button></h3><p>${hl(e.bezeichnung,toks)}</p><div class="meta">${tags}</div></article>`; };

  const rest = showBest ? list.slice(1) : list;
  const results = rest.map(resHTML).join('');

  const anders = Object.values(S.answers).includes(ANDERS);
  const empty = !list.length && anders ? `<div class="empty"><strong>Kein bekannter Fall für diesen Pfad.</strong><br>Antwort zurücknehmen oder <button class="linkbtn" data-ticket="1">mit Pfad an 2nd Level übergeben</button>.</div>`
    : !list.length ? `<div class="empty"><strong>Kein Fall zu „${esc(S.q)}“.</strong><br>Andere Begriffe oder Code versuchen, Angabe entfernen oder <button class="linkbtn" data-ticket="1">an 2nd Level übergeben</button>.</div>` : '';

  const prod = S.answers.produkt || (list.length && list.every(e=>e.zusatz?.produkt===list[0].zusatz?.produkt) ? list[0].zusatz?.produkt : null);
  const side = prod && PRODUKTE[prod] ? (()=>{ const p=PRODUKTE[prod]; const all=DATA.filter(e=>e.zusatz?.produkt===prod);
      const c={}; all.forEach(e=>c[e.kategorie]=(c[e.kategorie]||0)+1); const max=Math.max(...Object.values(c));
      const codes=[...new Set(all.map(e=>e.zusatz?.fehlercode).filter(Boolean))];
      return `<aside class="side"><div class="ph"><span class="pi">${p.k}</span><div><h2 style="margin:0">${esc(prod)}</h2><p>${esc(p.info)}</p></div></div>
        <dl class="kv"><dt>Aktuelle Version</dt><dd>${esc(p.version)}</dd><dt>Bekannte Fälle</dt><dd>${all.length}</dd></dl>
        <div style="display:flex;flex-direction:column;gap:6px"><span class="label">Fälle je Bereich</span>${Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar"><span>${esc(KURZ[k]||k)}</span><span><i style="width:${v/max*100}%"></i></span><span>${v}</span></div>`).join('')}</div>
        ${codes.length?`<div style="display:flex;flex-direction:column;gap:6px"><span class="label">Codes</span><div class="meta">${codes.map(x=>`<button class="tag tagbtn" data-q="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>`:''}
        <button class="btn" data-ticket="1">An 2nd Level übergeben</button></aside>`; })()
    : S.answers.kategorie ? (()=>{ const k=KATS.find(x=>x.name===S.answers.kategorie); return `<aside class="side"><div class="ph"><span class="pi">${icon(k?.id)}</span><div><h2 style="margin:0">${esc(k?.kurzname||'')}</h2><p>${esc(k?.name||'')}</p></div></div>
        <dl class="kv"><dt>Programm</dt><dd>${esc(pname(k?.programm))}</dd><dt>Bekannte Fälle</dt><dd>${DATA.filter(e=>e.kategorie===k?.name).length}</dd></dl>
        <p>Stufen: ${(k?.fragen||[]).map(esc).join(' · ')}</p><button class="btn" data-ticket="1">An 2nd Level übergeben</button></aside>`; })()
    : `<aside class="side"><h2>Ablauf</h2><p>Betreff, Symptom oder Code aus dem Ticket eingeben. 4 Stufen grenzen auf den Fall ein. „Unklar“ überspringt eine Stufe, „Anderes“ führt zur Übergabe an den 2nd Level.</p></aside>`;

  app.innerHTML = topBar() + `<nav class="tabs">${["Alle",...Object.keys(cats).sort()].map(t=>`<button class="${S.tab===t?'on':''}" data-tab="${esc(t)}">${esc(KURZ[t]||t)} <small>${t==="Alle"?narrowed.length:cats[t]}</small></button>`).join('')}</nav>
    <div class="cols"><div class="main"><div class="stats">${list.length} ${list.length===1?'Fall':'Fälle'}${S.q?` zu „${esc(S.q)}“`:''}${Object.keys(S.answers).length?' auf diesem Pfad':''}</div>
    ${guide}${best}${results}${empty}</div>${side}</div>`;
  bindSearch(app);
  bindCommon();
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render();});
  app.querySelectorAll('[data-ans]').forEach(b=>b.onclick=()=>{S.answers[b.dataset.ans]=b.dataset.v;render();});
  app.querySelectorAll('[data-skip]').forEach(b=>b.onclick=()=>{S.skipped.push(b.dataset.skip);render();});
  app.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{delete S.answers[b.dataset.rm];render();});
  app.querySelectorAll('[data-unskip]').forEach(b=>b.onclick=()=>{S.skipped=S.skipped.filter(k=>k!==b.dataset.unskip);render();});
  app.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>runSearch(b.dataset.q));
}
function bindCommon(){
  app.querySelector('#lg').onclick = goHome;
  app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDetail(b.dataset.open));
  app.querySelectorAll('[data-ticket]').forEach(b=>b.onclick=()=>{ S.detail=null; S.mode="eskalation"; S.view="detail"; render(); });
}
function antwortText(e, mitRueck){
  const z=e.zusatz||{}; const rf=lines(z.rueckfragen);
  return `Guten Tag,\n\n${z.textbaustein||''}${mitRueck&&rf.length?`\n\nDamit wir weiterhelfen können, beantworten Sie bitte noch:\n${rf.map(q=>`- ${q}`).join('\n')}`:''}\n\nMit freundlichen Grüßen\nIhr Fakturo-Support`;
}
function renderDetail(){
  const e = DATA.find(x=>x.id===S.detail);
  const z = e?.zusatz || {};
  const steps = lines(z.loesung);
  const rf = lines(z.rueckfragen);
  const kat = KATS.find(k=>k.name===e?.kategorie);
  const pfad = STUFEN.map((k,i)=>[kat?.fragen?.[i]||LABEL[k], z[k]]).filter(([,a])=>a);
  const facts = Object.entries(z).filter(([k])=>!INTERN.includes(k));
  const angaben = Object.entries(S.answers).map(([k,v])=>`${LABEL[k]}: ${showVal(k,v)}`).join("\n");
  const ticketText = `${e?`Fall ${e.id} „${e.name}“ greift nicht.\nDurchgeführt: ${steps.join('; ')}\n`:`Kein bekannter Fall.\n`}${S.q?`Suche: ${S.q}\n`:''}${angaben?`Pfad:\n${angaben}\n`:''}\nKunde / Ticket-Nr.:\nBeobachtung:\n`;
  const ticket = S.mode==="eskalation" ? `<section class="box" id="esk"><h2>Übergabe an 2nd Level</h2>
      <form id="tf"><textarea id="tt" rows="11" aria-label="Übergabetext">${esc(ticketText)}</textarea>
      <div class="helpful" style="margin-top:10px"><button class="btn pri" type="submit">Übergeben</button><span id="tmsg"></span></div></form></section>` : '';
  app.innerHTML = topBar() + `<article class="detail">
    <button class="back" id="bk">‹ Zurück zu den Fällen</button>
    ${e?`<div class="crumb"><span class="fav">${PRODUKTE[z.produkt]?.k||'F'}</span>${esc(pname(z.produkt))} › ${esc(KURZ[e.kategorie]||e.kategorie)} <span class="id">${e.id}</span></div>
    <h1>${esc(e.name)}</h1>
    <p class="diag lead">${esc(e.bezeichnung)}</p>
    <div class="meta">${pfad.map(([q,a],i)=>`<span class="tag" title="${esc(q)}">${i+1} · ${esc(a)}</span>`).join('')}${facts.map(([k,v])=>`<span class="tag">${esc(LABEL[k]||k)}: ${esc(k==="produkt"?pname(v):v)}</span>`).join('')}</div>
    ${steps.length?`<section class="box"><h2>Lösung</h2><ol class="solve">${steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></section>`:''}
    ${rf.length?`<section class="box"><h2>Rückfragen an den Kunden</h2><ul class="check">${rf.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></section>`:''}
    ${z.textbaustein?`<section class="box"><div class="boxhead"><h2>Textbaustein Antwort</h2><button class="btn sm" id="cp">Kopieren</button></div>
      ${rf.length?`<label class="opt"><input type="checkbox" id="mr" ${S.mitRueck?'checked':''}> Rückfragen anhängen</label>`:''}
      <pre class="tb" id="tbx">${esc(antwortText(e,S.mitRueck))}</pre></section>`:''}
    ${z.eskalation?`<section class="box note"><h2>Eskalation</h2><p style="margin:0">${esc(z.eskalation)}</p></section>`:''}
    <div class="helpful"><button class="btn ${S.mode==='geloest'?'pri':''}" id="hy">Gelöst</button><button class="btn ${S.mode==='eskalation'?'pri':''}" id="hn">An 2nd Level übergeben</button>
      ${S.mode==='geloest'?`<span class="okmsg">Als gelöst mit ${e.id} vermerkt (Mockup).</span>`:''}</div>
    ${ticket}
    ${z.begruendung?`<section class="box why"><h2>Begründung</h2><p style="margin:0">${esc(z.begruendung)}</p></section>`:''}`
    :`<h1>Übergabe an 2nd Level</h1>${ticket}`}
    ${e?`<details class="raw"><summary>Eintrag als JSON</summary><pre class="json">${esc(JSON.stringify(e,null,2))}</pre></details>`:''}
  </article>`;
  bindSearch(app); bindCommon();
  app.querySelector('#bk').onclick=()=>{ S.view = (S.q||Object.keys(S.answers).length)?"results":"home"; render(); };
  app.querySelector('#hy')?.addEventListener('click',()=>{S.mode='geloest';render();});
  app.querySelector('#hn')?.addEventListener('click',()=>{S.mode='eskalation';render();document.getElementById('esk')?.scrollIntoView({block:'start'});});
  app.querySelector('#mr')?.addEventListener('change',ev=>{S.mitRueck=ev.target.checked;document.getElementById('tbx').textContent=antwortText(e,S.mitRueck);});
  app.querySelector('#cp')?.addEventListener('click',ev=>copyText(antwortText(e,S.mitRueck),ev.currentTarget));
  app.querySelector('#tf')?.addEventListener('submit',ev=>{ev.preventDefault();document.getElementById('tmsg').innerHTML='<span class="okmsg">Übergabe T-1042 angelegt (Mockup, nichts gesendet).</span>';});
}
render();
</script>
