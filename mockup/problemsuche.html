Fakturo", "wann": "Beim Anlegen", "betriebssystem": "Windows", "stufe1": "Kunden anlegen oder pflegen", "stufe2": "Kunde doppelt vorhanden", "stufe3": "In der Kundenliste", "stufe4": "Zwei Kundennummern mit gleichem Namen", "frage": "Wie führe ich zwei doppelte Kunden zusammen?", "stichworte": "dublette doppelt kunde zusammenführen kundennummer", "loesung": "Kunden › Liste: nach Name + Ort filtern\nKdNr mit DATEV-Übergabe bzw. neueren Belegen = Ziel\nBeide markieren › Rechtsklick › Kunden zusammenführen\nZiel-KdNr wählen, Belege werden umgehängt", "rueckfragen": "Welche Kundennummer soll bestehen bleiben?\nWurde eine der beiden Nummern schon an DATEV bzw. das Steuerbüro übergeben?", "textbaustein": "der Kunde ist bei Ihnen zweimal angelegt, deshalb verteilen sich Aufträge und Rechnungen auf zwei Kundennummern. Sie können beide Datensätze unter Kunden › Liste markieren und per Rechtsklick „Kunden zusammenführen“. Behalten Sie bitte die Nummer, die bereits an DATEV übergeben wurde.", "eskalation": "2nd Level, wenn beide KdNr bereits DATEV-Buchungen haben (Debitorenkonten müssen im Steuerbüro umgebucht werden).", "begruendung": "Fakturo warnt beim Anlegen vor Dubletten, die Warnung lässt sich mit „Trotzdem anlegen“ übergehen. Beim Zusammenführen werden Aufträge, Rechnungen und offene Posten auf die Ziel-KdNr umgehängt, die andere wird inaktiv. Bleibt die KdNr ohne DATEV-Buchungen erhalten, passen die Debitorenkonten im Steuerbüro nicht mehr."}, "erstellt": "2026-11-14T08:00:00Z"}, {"id": "SUP-002", "name": "Kunde lässt sich nicht löschen", "kategorie": "Kunden und Kundenstammdaten anlegen, ändern und finden", "bezeichnung": "K-210. Kunde hat Belege in der Aufbewahrungsfrist (GoBD), Löschen gesperrt.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Löschen", "betriebssystem": "Windows", "fehlercode": "K-210", "stufe1": "Kunden löschen oder ausblenden", "stufe2": "Löschen wird verweigert", "stufe3": "Beim Löschen", "stufe4": "Meldung K-210", "frage": "Warum kann ich einen Kunden nicht löschen?", "stichworte": "kunde löschen geht nicht inaktiv archivieren gobd", "loesung": "Kunde › Reiter Belege: letzte Rechnung prüfen\nStatus auf „Inaktiv“ setzen\nFertig, Kunde verschwindet aus der Auftragsauswahl", "rueckfragen": "Soll der Kunde nur aus den Auswahllisten verschwinden oder geht es um eine Löschung nach DSGVO?", "textbaustein": "Kunden, zu denen es Rechnungen gibt, dürfen wegen der gesetzlichen Aufbewahrungspflicht (10 Jahre) nicht gelöscht werden. Setzen Sie den Kunden bitte auf „Inaktiv“. Er erscheint dann nicht mehr bei neuen Aufträgen, die Belege bleiben aber erhalten.", "eskalation": "Keine Eskalation. Bei DSGVO-Löschwunsch SUP-007 verwenden. Löschung per Datenbank wird nicht gemacht.", "begruendung": "Belege sind 10 Jahre aufbewahrungspflichtig (GoBD). Fakturo verhindert das Löschen von Kunden mit Belegen, weil sonst Verknüpfungen zu Rechnungen und offenen Posten verloren gehen. „Inaktiv“ blendet den Kunden aus, ohne Daten zu entfernen."}, "erstellt": "2026-11-10T07:00:00Z"}, {"id": "SUP-003", "name": "Kunde wird in der Suche nicht gefunden", "kategorie": "Kunden und Kundenstammdaten anlegen, ändern und finden", "bezeichnung": "Listenfilter „Nur aktive“ blendet inaktive Kunden und Interessenten aus.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Suchen", "betriebssystem": "Windows", "stufe1": "Kunden finden", "stufe2": "Kunde fehlt in der Liste", "stufe3": "In der Kundenliste", "stufe4": "Kein Treffer bei Name oder Nummer", "frage": "Warum finde ich einen Kunden nicht?", "stichworte": "kunde suchen finden nicht gefunden filter", "loesung": "Kundenliste: Filter „Nur aktive“ aus bzw. auf „Alle“\nNach KdNr, Ort oder Telefon suchen\nGgf. Status wieder auf „Aktiv“", "rueckfragen": "Haben Sie die Kundennummer oder den Ort des Kunden?\nWurde der Kunde früher auf inaktiv gesetzt?", "textbaustein": "Die Kundenliste zeigt standardmäßig nur aktive Kunden. Schalten Sie bitte oben in der Liste den Filter „Nur aktive“ aus und suchen Sie erneut. Danach können Sie den Kunden bei Bedarf wieder auf „Aktiv“ setzen.", "eskalation": "2nd Level, wenn der Kunde auch mit Filter „Alle“ fehlt und der Anwender Admin ist.", "begruendung": "Der Standardfilter der Kundenliste ist „Nur aktive“. Inaktive Kunden und Interessenten werden dadurch ausgeblendet. Kunden mit Status „Gesperrt“ sieht man auch mit „Alle“ nur mit Admin-Recht."}, "erstellt": "2026-11-06T06:00:00Z"}, {"id": "SUP-004", "name": "Neue Adresse erscheint nicht auf der Rechnung", "kategorie": "Kunden und Kundenstammdaten anlegen, ändern und finden", "bezeichnung": "Adresse wird bei Auftragsanlage in den Beleg kopiert. Änderung im Stamm wirkt nur auf neue Aufträge.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Drucken", "betriebssystem": "Windows", "stufe1": "Kunden anlegen oder pflegen", "stufe2": "Änderung wird nicht übernommen", "stufe3": "Auf Rechnung oder Auftrag", "stufe4": "Alte Adresse im Beleg", "frage": "Warum steht auf der Rechnung noch die alte Adresse?", "stichworte": "adresse alt falsch rechnungsadresse lieferadresse", "loesung": "Auftrag › Reiter Adresse › „Adresse aus Kundenstamm übernehmen“\nRechnung nicht versendet: neu erzeugen\nRechnung versendet: Storno + neue Rechnung (SUP-022)", "rueckfragen": "Wurde die Rechnung schon an den Kunden versendet?\nUm welche Auftrags- oder Rechnungsnummer geht es?", "textbaustein": "Fakturo übernimmt die Adresse beim Anlegen des Auftrags, damit der Beleg später unverändert bleibt. Öffnen Sie bitte den Auftrag, wählen Sie im Reiter „Adresse“ den Punkt „Adresse aus Kundenstamm übernehmen“ und erzeugen Sie die Rechnung neu. Ist die Rechnung schon versendet, ist ein Storno mit neuer Rechnung nötig.", "eskalation": "Keine Eskalation.", "begruendung": "Belege speichern die Adresse zum Zeitpunkt der Anlage. Das ist gewollt, damit ein Beleg auch nach Stammdatenänderungen den damaligen Stand zeigt. Versendete Rechnungen sind festgeschrieben und lassen sich nur per Storno korrigieren."}, "erstellt": "2026-11-02T05:00:00Z"}, {"id": "SUP-005", "name": "Leitweg-ID für Behördenkunden fehlt", "kategorie": "Kunden und Kundenstammdaten anlegen, ändern und finden", "bezeichnung": "X-BR-DE-15. Leitweg-ID fehlt im Kundenstamm, XRechnung für öffentlichen Auftraggeber wird nicht erzeugt.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Versenden", "betriebssystem": "Windows", "fehlercode": "X-BR-DE-15", "stufe1": "Kunden anlegen oder pflegen", "stufe2": "E-Rechnungsangaben fehlen", "stufe3": "Beim Rechnungsversand", "stufe4": "Meldung X-BR-DE-15", "frage": "Wo trage ich die Leitweg-ID ein?", "stichworte": "leitweg id behörde xrechnung öffentlicher auftraggeber e-rechnung", "loesung": "Kunde › Reiter E-Rechnung\nFormat „XRechnung“ + Leitweg-ID eintragen\nRechnung erneut als E-Rechnung erzeugen", "rueckfragen": "Wie lautet die Leitweg-ID laut Auftragsschreiben des Auftraggebers?", "textbaustein": "Öffentliche Auftraggeber verlangen in jeder XRechnung eine Leitweg-ID. Diese steht in der Regel im Auftragsschreiben oder wird vom Auftraggeber mitgeteilt. Tragen Sie sie bitte beim Kunden im Reiter „E-Rechnung“ ein, wählen Sie das Format „XRechnung“ und erzeugen Sie die Rechnung erneut.", "eskalation": "Keine Eskalation. Leitweg-ID nie raten, nur vom Auftraggeber.", "begruendung": "Die Regel BR-DE-15 der XRechnung verlangt die Käuferreferenz, bei Behörden die Leitweg-ID. Ohne diese Angabe bricht Fakturo die Erzeugung ab, damit keine ungültige E-Rechnung versendet wird."}, "erstellt": "2026-11-03T04:00:00Z"}, {"id": "SUP-006", "name": "Kunde fehlt in der Auftragsauswahl", "kategorie": "Kunden und Kundenstammdaten anlegen, ändern und finden", "bezeichnung": "Kunde hat Status „Interessent“, erscheint nicht in der Auftragsauswahl.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Anlegen", "betriebssystem": "Windows", "stufe1": "Kunden finden", "stufe2": "Kunde fehlt bei neuem Auftrag", "stufe3": "Beim Anlegen eines Auftrags", "stufe4": "Kunde ist als Interessent markiert", "frage": "Warum kann ich einen Kunden nicht für einen Auftrag auswählen?", "stichworte": "kunde auswahl auftrag interessent fehlt", "loesung": "Kunde öffnen › Status „Interessent“ › „Kunde“\nAuftrag neu anlegen\nAlternativ: angenommenes Angebot in Auftrag umwandeln (wandelt automatisch)", "rueckfragen": "Gibt es zu diesem Kunden ein angenommenes Angebot?", "textbaustein": "Der Kontakt ist bei Ihnen noch als Interessent angelegt. Interessenten können Angebote, aber keine Aufträge erhalten. Ändern Sie bitte im Kunden den Status auf „Kunde“ und legen Sie den Auftrag danach erneut an.", "eskalation": "Keine Eskalation.", "begruendung": "Interessenten sind für Angebote gedacht. Erst mit Status „Kunde“ sind Aufträge und Rechnungen möglich. Wird ein angenommenes Angebot in einen Auftrag umgewandelt, ändert Fakturo den Status automatisch."}, "erstellt": "2026-10-30T03:00:00Z"}, {"id": "SUP-007", "name": "Kunde verlangt Löschung seiner Daten", "kategorie": "Kunden und Kundenstammdaten anlegen, ändern und finden", "bezeichnung": "DSGVO-Löschwunsch, Belege in Aufbewahrungsfrist. Sperren bis Fristende statt löschen.", "zusatz": {"produkt": "Fakturo", "wann": "Auf Kundenwunsch", "betriebssystem": "Windows", "stufe1": "Kunden löschen oder ausblenden", "stufe2": "Löschung nach DSGVO gewünscht", "stufe3": "Auf Kundenwunsch", "stufe4": "Es gibt Rechnungen in der Aufbewahrungsfrist", "frage": "Wie gehe ich mit einer DSGVO-Löschanfrage um?", "stichworte": "dsgvo löschen datenschutz sperren anonymisieren", "loesung": "Kunde › Datenschutz › „Sperren bis Fristende“\nWerbe-Einwilligungen entfernen\nBestätigung als PDF erzeugen, Betrieb schickt sie an den Endkunden", "rueckfragen": "Liegt der Löschwunsch schriftlich vor?\nGibt es Rechnungen aus den letzten 10 Jahren?", "textbaustein": "Wegen der steuerlichen Aufbewahrungspflicht können Kundendaten mit Rechnungen nicht sofort gelöscht werden. Wählen Sie bitte im Kunden unter „Datenschutz“ die Option „Sperren bis Fristende“. Die Daten werden dann gesperrt und nach Ablauf der Frist automatisch gelöscht. Die Bestätigung für Ihren Kunden können Sie dort als PDF erzeugen.", "eskalation": "Keine Eskalation. Antwort an den Endkunden gibt der Betrieb, nicht wir.", "begruendung": "Art. 17 DSGVO tritt hinter gesetzliche Aufbewahrungspflichten (§ 147 AO, GoBD) zurück. Gesperrte Daten sind nur noch für Prüfungen zugänglich und werden nach Fristende automatisch entfernt."}, "erstellt": "2026-10-26T09:00:00Z"}, {"id": "SUP-008", "name": "Auftrag lässt sich nicht mehr bearbeiten", "kategorie": "Aufträge anlegen, bearbeiten und abschließen", "bezeichnung": "A-310. Auftrag ist abgerechnet und dadurch gesperrt.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Bearbeiten", "betriebssystem": "Windows", "fehlercode": "A-310", "stufe1": "Auftrag bearbeiten", "stufe2": "Änderungen sind nicht möglich", "stufe3": "Abgerechnet", "stufe4": "Felder grau, Meldung A-310", "frage": "Warum kann ich einen Auftrag nicht mehr ändern?", "stichworte": "auftrag gesperrt bearbeiten ändern abgerechnet", "loesung": "Zur Rechnung des Auftrags wechseln\nRechnung stornieren (Stornorechnung)\nAuftrag ist wieder offen, ändern\nNeue Rechnung erstellen\nBei Teilrechnungen nur die betroffene stornieren", "rueckfragen": "Wurde die Rechnung zum Auftrag bereits versendet?\nGibt es mehrere Teilrechnungen zum Auftrag?", "textbaustein": "Sobald ein Auftrag abgerechnet ist, sperrt Fakturo ihn, damit Auftrag und Rechnung übereinstimmen. Für eine Änderung stornieren Sie bitte die zugehörige Rechnung. Danach ist der Auftrag wieder offen und Sie können ihn ändern und neu abrechnen.", "eskalation": "Keine Eskalation.", "begruendung": "Abgerechnete Aufträge werden gesperrt, damit Rechnung und Auftrag nicht auseinanderlaufen. Die Stornorechnung hebt die Sperre auf und dokumentiert die Korrektur GoBD-konform."}, "erstellt": "2026-10-22T08:00:00Z"}, {"id": "SUP-009", "name": "Positionen aus dem Angebot fehlen im Auftrag", "kategorie": "Aufträge anlegen, bearbeiten und abschließen", "bezeichnung": "Nur angenommene Angebotspositionen werden übernommen, optionale fehlen.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Anlegen", "betriebssystem": "Windows", "stufe1": "Auftrag anlegen", "stufe2": "Positionen fehlen", "stufe3": "Aus Angebot übernommen", "stufe4": "Fehlende Positionen sind im Angebot optional", "frage": "Warum fehlen Positionen, wenn ich ein Angebot in einen Auftrag umwandle?", "stichworte": "angebot auftrag übernehmen positionen fehlen optional", "loesung": "Angebot › Spalte Status der Positionen prüfen\nFehlende Positionen auf „angenommen“\nAuftrag › „Positionen aus Angebot nachladen“\nBei mehreren Angebotsversionen: zuletzt angenommene wird verwendet", "rueckfragen": "Welche Positionen fehlen genau?\nGibt es mehrere Versionen des Angebots?", "textbaustein": "Bei der Übernahme eines Angebots übernimmt Fakturo nur Positionen, die als angenommen markiert sind. Setzen Sie bitte die fehlenden Positionen im Angebot auf „angenommen“ und wählen Sie im Auftrag „Positionen aus Angebot nachladen“.", "eskalation": "Keine Eskalation.", "begruendung": "Optionale und Alternativpositionen gelten erst als beauftragt, wenn sie angenommen sind. So landen nicht beauftragte Leistungen nicht versehentlich in Auftrag und Rechnung."}, "erstellt": "2026-10-18T07:00:00Z"}, {"id": "SUP-010", "name": "Auftrag ist verschwunden", "kategorie": "Aufträge anlegen, bearbeiten und abschließen", "bezeichnung": "Standardfilter Auftragsliste: nur offen + laufendes Jahr.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Suchen", "betriebssystem": "Windows", "stufe1": "Auftrag finden", "stufe2": "Auftrag ist nicht in der Liste", "stufe3": "Erledigt oder älter", "stufe4": "Filter steht auf „Offen“ oder laufendes Jahr", "frage": "Wo finde ich einen erledigten Auftrag?", "stichworte": "auftrag weg verschwunden finden erledigt filter", "loesung": "Auftragsliste › Filter Status „Alle“\nZeitraum erweitern oder nach AuftragsNr suchen\nNicht gefunden: Aufträge › Gelöschte (Entwürfe 30 Tage wiederherstellbar)", "rueckfragen": "Haben Sie die Auftragsnummer oder die Kundennummer?\nIst der Auftrag erledigt oder aus einem Vorjahr?", "textbaustein": "Die Auftragsliste zeigt standardmäßig nur offene Aufträge des laufenden Jahres. Stellen Sie bitte den Filter „Status“ auf „Alle“ und erweitern Sie den Zeitraum, oder suchen Sie direkt nach der Auftragsnummer.", "eskalation": "2nd Level, wenn ein Auftrag mit Rechnung weder in der Liste noch unter Gelöscht auftaucht.", "begruendung": "Erledigte Aufträge und Vorjahre sind über die Standardfilter ausgeblendet. Gelöschte Entwürfe liegen 30 Tage unter „Gelöschte“. Aufträge mit Rechnung können nicht gelöscht werden."}, "erstellt": "2026-10-19T06:00:00Z"}, {"id": "SUP-011", "name": "Auftragsnummern haben Lücken", "kategorie": "Aufträge anlegen, bearbeiten und abschließen", "bezeichnung": "Auftragsnummer wird beim Öffnen vergeben, verworfene Entwürfe erzeugen Lücken. Bei Aufträgen unkritisch.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Anlegen", "betriebssystem": "Windows", "stufe1": "Auftrag anlegen", "stufe2": "Auftragsnummer springt", "stufe3": "Neu angelegt", "stufe4": "Verworfene Entwürfe haben Nummern belegt", "frage": "Warum fehlen Auftragsnummern?", "stichworte": "nummernkreis auftragsnummer lücke springt", "loesung": "Einstellungen › Nummernkreise › Aufträge: „Nummer erst beim Speichern vergeben“ aktivieren\nSicherstellen, dass es um Auftrags- und nicht um Rechnungsnummern geht", "rueckfragen": "Betrifft es Auftrags- oder Rechnungsnummern?", "textbaustein": "Lücken bei Auftragsnummern entstehen, wenn ein neuer Auftrag geöffnet und ohne Speichern verworfen wird. Das ist bei Aufträgen zulässig. Wenn Sie es vermeiden möchten, aktivieren Sie unter Einstellungen › Nummernkreise die Option „Nummer erst beim Speichern vergeben“.", "eskalation": "Sofort 2nd Level bei Lücken in Rechnungsnummern (GoBD-relevant).", "begruendung": "Für Rechnungsnummern verlangt das Steuerrecht eine lückenlose Folge, für Auftragsnummern nicht. Standardmäßig reserviert Fakturo die Nummer beim Öffnen, damit mehrere Arbeitsplätze nicht dieselbe Nummer ziehen."}, "erstellt": "2026-10-15T05:00:00Z"}, {"id": "SUP-012", "name": "Gestempelte Stunden fehlen im Auftrag", "kategorie": "Aufträge anlegen, bearbeiten und abschließen", "bezeichnung": "Am Terminal ohne Auftragsnummer gestempelt, Zeit nur im Zeitkonto, nicht am Auftrag.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Abrechnen", "betriebssystem": "Windows", "geraet": "Zeiterfassungsterminal", "stufe1": "Zeiten im Auftrag", "stufe2": "Gestempelte Stunden fehlen", "stufe3": "In Arbeit", "stufe4": "Buchungen ohne Auftragsnummer in der Buchungsliste", "frage": "Warum sehe ich die Arbeitszeit nicht im Auftrag?", "stichworte": "stunden zeiten fehlen auftrag terminal leistung zuordnen", "loesung": "Personal › Buchungen, Zeitraum wählen\nBuchungen mit leerer Spalte Auftrag markieren\n„Auftrag zuordnen“\nAuftrag › „Zeiten übernehmen“", "rueckfragen": "Welche Person und welcher Tag sind betroffen?\nUm welchen Auftrag geht es?", "textbaustein": "Die Stunden wurden am Terminal ohne Auftragsnummer gestempelt und liegen deshalb nur im Zeitkonto. Unter Personal › Buchungen können Sie die Buchungen markieren und mit „Auftrag zuordnen“ dem Auftrag zuweisen. Danach im Auftrag „Zeiten übernehmen“ ausführen. Für die Zukunft bitte am Terminal die Auftragstaste nutzen.", "eskalation": "Keine Eskalation.", "begruendung": "Kommen/Gehen ohne Auftrag erzeugt nur Anwesenheitszeit. Erst mit Auftragsbezug wird daraus eine übernehmbare Leistungszeit."}, "erstellt": "2026-10-11T04:00:00Z"}, {"id": "SUP-013", "name": "Auftrag lässt sich nicht abschließen", "kategorie": "Aufträge anlegen, bearbeiten und abschließen", "bezeichnung": "A-320. Offene Zeitbuchungen am Auftrag, noch nicht als Leistung übernommen.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Abschließen", "betriebssystem": "Windows", "fehlercode": "A-320", "stufe1": "Auftrag bearbeiten", "stufe2": "Abschließen wird verweigert", "stufe3": "In Arbeit", "stufe4": "Meldung A-320: offene Zeitbuchungen", "frage": "Warum kann ich einen Auftrag nicht abschließen?", "stichworte": "auftrag abschließen geht nicht offene zeiten", "loesung": "Auftrag › Reiter Zeiten\n„Zeiten übernehmen“\nAuftrag erneut abschließen\nNicht „Ohne Übernahme abschließen“ empfehlen", "rueckfragen": "Sollen die gestempelten Stunden mit abgerechnet werden?", "textbaustein": "Zum Auftrag gibt es noch Zeitbuchungen, die nicht als Leistung übernommen wurden. Öffnen Sie bitte im Auftrag den Reiter „Zeiten“, wählen Sie „Zeiten übernehmen“ und schließen Sie den Auftrag danach erneut ab.", "eskalation": "Keine Eskalation.", "begruendung": "Fakturo verhindert den Abschluss, damit keine gestempelten Stunden unberechnet bleiben. „Ohne Übernahme abschließen“ ist möglich, die Stunden fehlen dann aber dauerhaft in der Rechnung."}, "erstellt": "2026-10-07T03:00:00Z"}, {"id": "SUP-014", "name": "Stunden stehen doppelt im Auftrag", "kategorie": "Aufträge anlegen, bearbeiten und abschließen", "bezeichnung": "Doppelte Stempelquelle: Terminal + App für denselben Einsatz, beide übernommen.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Abrechnen", "betriebssystem": "Windows", "geraet": "Zeiterfassungsterminal", "stufe1": "Zeiten im Auftrag", "stufe2": "Stunden doppelt", "stufe3": "In Arbeit", "stufe4": "Zeiten aus Terminal und App doppelt übernommen", "frage": "Warum stehen Stunden doppelt im Auftrag?", "stichworte": "doppelt stunden zeiten auftrag app terminal", "loesung": "Auftrag › Zeiten nach Person sortieren, Spalte Quelle prüfen\nDoppelte Zeilen › „Aus Leistung entfernen“\nPersonal › Person › Zeiterfassung: nur eine Stempelquelle freigeben", "rueckfragen": "Welche Person und welcher Tag sind betroffen?\nSoll die Person künftig am Terminal oder in der App stempeln?", "textbaustein": "Für denselben Einsatz wurde am Terminal und zusätzlich in der App gestempelt, deshalb stehen die Stunden doppelt im Auftrag. Entfernen Sie bitte im Reiter „Zeiten“ die doppelten Zeilen mit „Aus Leistung entfernen“. Damit das nicht wieder passiert, legen Sie unter Personal › Person › Zeiterfassung eine einzige Stempelquelle fest.", "eskalation": "Keine Eskalation.", "begruendung": "Terminal und Fakturo Zeit liefern unabhängig voneinander Buchungen. Fakturo erkennt Überschneidungen nicht automatisch, solange beide Quellen für eine Person aktiv sind."}, "erstellt": "2026-10-03T09:00:00Z"}, {"id": "SUP-015", "name": "Leistung wird mit 0,00 € berechnet", "kategorie": "Auftragsdetails: Material und Leistungen erfassen und berechnen", "bezeichnung": "Kein Stundensatz an Leistungsart und Kunde, Position mit 0,00 €.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Abrechnen", "betriebssystem": "Windows", "stufe1": "Leistungen", "stufe2": "Preis fehlt oder ist 0,00 €", "stufe3": "Im Auftrag", "stufe4": "Leistungsart ohne Stundensatz", "frage": "Warum steht bei einer Leistung 0,00 €?", "stichworte": "stundensatz fehlt leistung null preis lohngruppe", "loesung": "Leistungsart der Position notieren\nStammdaten › Leistungsarten: Stundensatz eintragen\nOptional Kunde › Konditionen: Kundenstundensatz\nAuftrag › „Preise neu berechnen“", "rueckfragen": "Welcher Stundensatz gilt für diesen Kunden bzw. diese Leistung?", "textbaustein": "Für die Leistungsart ist kein Stundensatz hinterlegt. Tragen Sie ihn bitte unter Stammdaten › Leistungsarten ein (oder kundenbezogen im Kunden unter „Konditionen“) und wählen Sie im Auftrag „Preise neu berechnen“.", "eskalation": "Keine Eskalation.", "begruendung": "Preisfindung: Positionsrabatt/-preis vor Kundenpreis vor Leistungsart-Preis. Ist auf keiner Ebene ein Satz hinterlegt, setzt Fakturo 0,00 €."}, "erstellt": "2026-10-04T08:00:00Z"}, {"id": "SUP-016", "name": "Material hat noch den alten Preis", "kategorie": "Auftragsdetails: Material und Leistungen erfassen und berechnen", "bezeichnung": "Position vor Preislisten-Import eingefügt, behält alten Preis.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Abrechnen", "betriebssystem": "Windows", "stufe1": "Material", "stufe2": "Preis stimmt nicht", "stufe3": "Im Auftrag", "stufe4": "Position vor Preislisten-Import eingefügt", "frage": "Warum wird Material mit dem alten Preis berechnet?", "stichworte": "material preis alt preisliste artikel einkauf", "loesung": "Artikel › Preislisten: Import prüfen\nAuftrag: Positionen markieren › „Preise aus Artikelstamm aktualisieren“\nBereits berechnete Rechnungen bleiben unverändert", "rueckfragen": "Wann wurde die neue Lieferantenpreisliste importiert?", "textbaustein": "Positionen behalten den Preis vom Zeitpunkt des Einfügens. Markieren Sie bitte im Auftrag die Positionen und wählen Sie „Preise aus Artikelstamm aktualisieren“. Bereits erstellte Rechnungen ändern sich dadurch nicht.", "eskalation": "Keine Eskalation.", "begruendung": "Preise werden beim Einfügen in die Position kopiert, damit sich laufende Aufträge nicht durch einen Import unbemerkt ändern."}, "erstellt": "2026-09-30T07:00:00Z"}, {"id": "SUP-017", "name": "Lagerbestand wird nicht abgebucht", "kategorie": "Auftragsdetails: Material und Leistungen erfassen und berechnen", "bezeichnung": "Lagerbuchung bei Aufträgen deaktiviert bzw. Auftrag nicht „ausgeführt“.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Abschließen", "betriebssystem": "Windows", "stufe1": "Material", "stufe2": "Bestand ändert sich nicht", "stufe3": "Nach Auftragsabschluss", "stufe4": "Lagerbuchung ist ausgeschaltet", "frage": "Warum ändert sich der Bestand nicht, wenn ich Material verbrauche?", "stichworte": "lager bestand material abbuchen verbrauch", "loesung": "Einstellungen › Lager › „Bestand bei Auftrag buchen“ aktivieren\nArtikel als Lagerartikel markiert?\nAuftrag auf „ausgeführt“\nVergangenheit per Inventur korrigieren", "rueckfragen": "Ab wann soll der Bestand automatisch gebucht werden?\nIst der Artikel als Lagerartikel angelegt?", "textbaustein": "Der Lagerbestand wird nur abgebucht, wenn unter Einstellungen › Lager „Bestand bei Auftrag buchen“ aktiv ist und der Auftrag auf „ausgeführt“ steht. Bitte aktivieren Sie die Option. Für zurückliegende Aufträge korrigieren Sie den Bestand bitte einmalig per Inventur.", "eskalation": "Keine Eskalation.", "begruendung": "Die Lagerbuchung ist standardmäßig aus, weil viele Betriebe ohne Lager arbeiten. Rückwirkend bucht Fakturo nicht, damit Bestände nicht doppelt verändert werden."}, "erstellt": "2026-09-26T06:00:00Z"}, {"id": "SUP-018", "name": "Fahrzeit und Pausen landen in der Leistung", "kategorie": "Auftragsdetails: Material und Leistungen erfassen und berechnen", "bezeichnung": "Zeitübernahme nimmt alle Buchungsarten mit, auch Pause und Fahrzeit.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Abrechnen", "betriebssystem": "Windows", "geraet": "Zeiterfassungsterminal", "stufe1": "Leistungen", "stufe2": "Zu viele Stunden berechnet", "stufe3": "Nach Zeitübernahme", "stufe4": "Pause und Fahrzeit sind mit übernommen", "frage": "Wie rechne ich Fahrzeit getrennt ab?", "stichworte": "fahrzeit pause leistung übernehmen anfahrt", "loesung": "Einstellungen › Zeitübernahme: Pausen ausschließen\nFahrzeit als eigene Leistungsart „Anfahrt“\nAuftrag: Zeiten erneut übernehmen", "rueckfragen": "Soll Fahrzeit berechnet werden, und wenn ja, zu welchem Satz?", "textbaustein": "Bei der Übernahme von Terminalzeiten werden standardmäßig alle Zeiten übernommen. Unter Einstellungen › Zeitübernahme können Sie Pausen ausschließen und Fahrzeit als eigene Leistungsart „Anfahrt“ abrechnen. Ob Fahrzeit berechnet wird, legen Sie selbst fest.", "eskalation": "Keine Eskalation.", "begruendung": "Standard ist „alles übernehmen“, damit keine Zeit verloren geht. Ob Fahrzeit berechnet wird, ist eine Entscheidung des Betriebs."}, "erstellt": "2026-09-22T05:00:00Z"}, {"id": "SUP-019", "name": "Kundenrabatt gilt nicht für Material", "kategorie": "Auftragsdetails: Material und Leistungen erfassen und berechnen", "bezeichnung": "Kundenrabatt nur auf Leistungen gesetzt, Materialrabatt leer.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Abrechnen", "betriebssystem": "Windows", "stufe1": "Material", "stufe2": "Rabatt fehlt", "stufe3": "Im Auftrag", "stufe4": "Kundenrabatt gilt nur für Leistungen", "frage": "Warum wird der Rabatt nicht auf Material gewährt?", "stichworte": "rabatt material kundenrabatt nachlass", "loesung": "Kunde › Konditionen: Rabatt Material eintragen\nAuftrag › „Preise neu berechnen“", "rueckfragen": "Welcher Rabatt soll für Material gelten?", "textbaustein": "Fakturo führt für Material und Leistungen getrennte Rabattfelder. Tragen Sie bitte beim Kunden unter „Konditionen“ auch den Rabatt für Material ein und wählen Sie im Auftrag „Preise neu berechnen“.", "eskalation": "Keine Eskalation.", "begruendung": "Getrennte Rabattfelder erlauben unterschiedliche Konditionen für Material und Arbeitszeit. Positionsrabatte überschreiben Kundenrabatte."}, "erstellt": "2026-09-18T04:00:00Z"}, {"id": "SUP-020", "name": "Zuschläge für Nacht und Wochenende fehlen", "kategorie": "Auftragsdetails: Material und Leistungen erfassen und berechnen", "bezeichnung": "Keine Zuschlagsregel an der Leistungsart, Nacht/So/Feiertag zum Normalsatz.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Abrechnen", "betriebssystem": "Windows", "stufe1": "Leistungen", "stufe2": "Zuschlag fehlt (Nacht, Wochenende, Feiertag)", "stufe3": "Nach Zeitübernahme", "stufe4": "Keine Zuschlagsregel für die Leistungsart", "frage": "Warum werden keine Nachtzuschläge berechnet?", "stichworte": "zuschlag nacht wochenende feiertag sonntag leistung", "loesung": "Buchungszeit prüfen (Uhrzeit, Wochentag)\nStammdaten › Leistungsarten › Zuschläge: Zeitraum + Prozent anlegen\nEinstellungen › Feiertage: Bundesland\nAuftrag: Zeiten erneut übernehmen", "rueckfragen": "Welche Zuschläge sind vereinbart (Nacht, Sonntag, Feiertag, jeweils in Prozent)?\nIn welchem Bundesland liegt das Objekt?", "textbaustein": "Für die Leistungsart ist keine Zuschlagsregel hinterlegt. Legen Sie die Zuschläge bitte unter Stammdaten › Leistungsarten › Zuschläge mit Uhrzeit und Prozentsatz an und übernehmen Sie die Zeiten im Auftrag erneut. Die Zuschläge gelten nur für neue Übernahmen.", "eskalation": "Keine Eskalation.", "begruendung": "Typisch bei Objektschutz und Wachdienst. Zuschläge werden bei der Zeitübernahme berechnet, bereits übernommene Zeiten ändern sich nicht von selbst."}, "erstellt": "2026-09-19T03:00:00Z"}, {"id": "SUP-021", "name": "Menge oder Einheit beim Material falsch", "kategorie": "Auftragsdetails: Material und Leistungen erfassen und berechnen", "bezeichnung": "Artikel in Verpackungseinheit geführt, in Stück gebucht.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Abrechnen", "betriebssystem": "Windows", "stufe1": "Material", "stufe2": "Menge oder Einheit falsch", "stufe3": "Im Auftrag", "stufe4": "Artikel hat Verpackungseinheit statt Stück", "frage": "Warum stimmt die Materialmenge nicht?", "stichworte": "menge einheit material stück paket meter", "loesung": "Artikel › Einheiten: Verkaufseinheit + Umrechnungsfaktor prüfen\nPosition mit richtiger Einheit neu erfassen\nEinheit nach erster Buchung nicht ändern, ggf. neuen Artikel", "rueckfragen": "In welcher Einheit wird der Artikel verkauft (Stück, Paket, Meter)?", "textbaustein": "Der Artikel wird in einer anderen Einheit geführt als im Auftrag erfasst. Prüfen Sie bitte unter Artikel › Einheiten die Verkaufseinheit und erfassen Sie die Position mit der richtigen Einheit neu.", "eskalation": "Keine Eskalation.", "begruendung": "Umrechnungsfaktoren (z. B. 1 Paket = 100 Stück) gelten pro Artikel. Wird die Einheit nach Buchungen geändert, stimmen Lager und alte Belege nicht mehr."}, "erstellt": "2026-09-15T09:00:00Z"}, {"id": "SUP-022", "name": "Rechnung nach Versand ändern", "kategorie": "Rechnungen, Gutschriften, Mahnungen und E-Rechnung", "bezeichnung": "R-100. Rechnung versendet und festgeschrieben (GoBD), nur Storno + Neurechnung.", "zusatz": {"produkt": "Fakturo", "wann": "Nach dem Versand", "betriebssystem": "Windows", "fehlercode": "R-100", "stufe1": "Rechnung", "stufe2": "Muss korrigiert werden", "stufe3": "Bereits versendet", "stufe4": "Bearbeiten ist gesperrt (R-100)", "frage": "Wie korrigiere ich eine Rechnung, die schon raus ist?", "stichworte": "rechnung stornieren korrigieren ändern storno gutschrift", "loesung": "Zahlung zugeordnet? Erst lösen\nRechnung › Stornieren\nStornorechnung an Kunden senden\nAuftrag korrigieren, neue Rechnung", "rueckfragen": "Ist zu der Rechnung schon eine Zahlung eingegangen?", "textbaustein": "Versendete Rechnungen dürfen nach den GoBD nicht mehr geändert werden. Stornieren Sie die Rechnung bitte über „Stornieren“, senden Sie die Stornorechnung an Ihren Kunden und erstellen Sie danach eine neue Rechnung.", "eskalation": "Keine Eskalation.", "begruendung": "Mit dem Versand wird die Rechnung festgeschrieben. Die Korrektur muss nachvollziehbar sein, deshalb Stornorechnung statt Änderung."}, "erstellt": "2026-09-11T08:00:00Z"}, {"id": "SUP-023", "name": "E-Rechnung wird bei der Prüfung abgelehnt", "kategorie": "Rechnungen, Gutschriften, Mahnungen und E-Rechnung", "bezeichnung": "X-BR-CO-25. E-Rechnung unvollständig, meist Zahlungsbedingungen/Bank fehlen.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Versenden", "betriebssystem": "Windows", "fehlercode": "X-BR-CO-25", "stufe1": "E-Rechnung", "stufe2": "Wird abgelehnt", "stufe3": "Erzeugt, noch nicht angenommen", "stufe4": "Prüfprotokoll meldet X-BR-CO-25", "frage": "Warum wird meine E-Rechnung abgelehnt?", "stichworte": "e-rechnung fehler xrechnung zugferd validierung abgelehnt", "loesung": "Rechnung › E-Rechnung › Prüfprotokoll: Regelnummern notieren\nPflichtfelder im Firmenstamm (Bank, USt-ID) bzw. Kunde (E-Rechnung) ergänzen\nE-Rechnung neu erzeugen + prüfen", "rueckfragen": "Welche Regelnummer steht im Prüfprotokoll bzw. in der Ablehnung des Empfängers?", "textbaustein": "Ihre E-Rechnung wurde abgelehnt, weil Pflichtangaben fehlen. Das Prüfprotokoll in der Rechnung unter „E-Rechnung“ zeigt, welche Angaben das sind. Ergänzen Sie diese bitte im Firmen- bzw. Kundenstamm und erzeugen Sie die E-Rechnung erneut.", "eskalation": "2nd Level, wenn das Prüfprotokoll fehlerfrei ist und der Empfänger trotzdem ablehnt.", "begruendung": "BR-CO-25 verlangt Fälligkeitsdatum oder Zahlungsbedingungen bei positivem Betrag. Regelnummern mit BR- stammen aus der EN 16931, die Regelliste öffnet sich im Prüfprotokoll per Klick."}, "erstellt": "2026-09-07T07:00:00Z"}, {"id": "SUP-024", "name": "Mahnung geht an einen Kunden, der bezahlt hat", "kategorie": "Rechnungen, Gutschriften, Mahnungen und E-Rechnung", "bezeichnung": "Zahlung eingegangen, aber nicht verbucht. Bankabgleich lief nicht vor dem Mahnlauf.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Mahnlauf", "betriebssystem": "Windows", "stufe1": "Mahnung", "stufe2": "Mahnung trotz Zahlung", "stufe3": "Rechnung steht auf offen", "stufe4": "Zahlung ist nicht verbucht", "frage": "Warum bekommt ein Kunde eine Mahnung, obwohl er bezahlt hat?", "stichworte": "mahnung trotz zahlung bezahlt offen posten bankabgleich", "loesung": "OP des Kunden prüfen\nKontoauszug-Import des Tages prüfen\nZahlung der Rechnung zuordnen\nMahnung stornieren\nMahnlauf: „vorher Bankabgleich“ aktivieren", "rueckfragen": "Wann und unter welchem Verwendungszweck ist die Zahlung eingegangen?", "textbaustein": "Die Zahlung war auf Ihrem Konto eingegangen, aber noch nicht in Fakturo zugeordnet. Bitte ordnen Sie die Zahlung der Rechnung zu, stornieren Sie die Mahnung und informieren Sie Ihren Kunden. Damit das nicht wieder vorkommt, können Sie den Mahnlauf so einstellen, dass vorher automatisch der Bankabgleich läuft.", "eskalation": "Keine Eskalation.", "begruendung": "Der Mahnlauf berücksichtigt nur verbuchte Zahlungen. Ohne vorherigen Bankabgleich gelten bezahlte Rechnungen weiter als offen."}, "erstellt": "2026-09-03T06:00:00Z"}, {"id": "SUP-025", "name": "Rechnung per E-Mail kommt nicht an", "kategorie": "Rechnungen, Gutschriften, Mahnungen und E-Rechnung", "bezeichnung": "M-550. Mailserver lehnt ab, meist Absender passt nicht zum Konto oder Anhang zu groß.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Versenden", "betriebssystem": "Windows", "fehlercode": "M-550", "stufe1": "Rechnung", "stufe2": "Kommt beim Kunden nicht an", "stufe3": "Versendet", "stufe4": "Versandprotokoll meldet M-550", "frage": "Warum kommt meine Rechnungs-Mail nicht an?", "stichworte": "email versand rechnung kommt nicht an smtp spam", "loesung": "Rechnung › Versandprotokoll: Serverantwort lesen\nEinstellungen › E-Mail › Testmail\nAbsenderadresse = Mailkonto\nAnhänge > 10 MB als Link", "rueckfragen": "Wie lautet die Fehlermeldung im Versandprotokoll?\nWer betreut Ihren Mailserver?", "textbaustein": "Ihr Mailserver hat die Nachricht abgelehnt. Prüfen Sie bitte unter Einstellungen › E-Mail, ob die Absenderadresse zu Ihrem Mailkonto passt, und senden Sie eine Testmail. Bleibt der Fehler, wenden Sie sich bitte mit der Meldung aus dem Versandprotokoll an Ihren IT-Dienstleister.", "eskalation": "Keine Eskalation. Liegt beim IT-Dienstleister des Kunden.", "begruendung": "550 ist eine dauerhafte Ablehnung des Mailservers (z. B. Absender nicht erlaubt, SPF, Größenlimit). Fakturo übergibt nur an den Server, die Lösung liegt dort."}, "erstellt": "2026-09-04T05:00:00Z"}, {"id": "SUP-026", "name": "Schlussrechnung zieht Abschläge nicht ab", "kategorie": "Rechnungen, Gutschriften, Mahnungen und E-Rechnung", "bezeichnung": "Abschlagsrechnungen ohne Auftragsverknüpfung, werden in der Schlussrechnung nicht abgezogen.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Abrechnen", "betriebssystem": "Windows", "stufe1": "Rechnung", "stufe2": "Betrag stimmt nicht", "stufe3": "Schlussrechnung", "stufe4": "Abschläge ohne Auftragsverknüpfung", "frage": "Warum werden Abschlagszahlungen in der Schlussrechnung nicht abgezogen?", "stichworte": "abschlag schlussrechnung abschlagsrechnung teilrechnung", "loesung": "Abschlagsrechnungen des Kunden: Feld Auftrag prüfen\n„Auftrag zuordnen“\nSchlussrechnung neu erzeugen\nSchon versendet: Storno + neue Schlussrechnung", "rueckfragen": "Welche Abschlagsrechnungen gehören zu dem Auftrag?\nWurde die Schlussrechnung schon versendet?", "textbaustein": "Die Abschlagsrechnungen wurden ohne Bezug zum Auftrag erstellt, deshalb zieht die Schlussrechnung sie nicht ab. Öffnen Sie bitte jede Abschlagsrechnung, verknüpfen Sie sie über „Auftrag zuordnen“ mit dem Auftrag und erzeugen Sie die Schlussrechnung neu.", "eskalation": "Keine Eskalation.", "begruendung": "Fakturo zieht nur Abschläge ab, die demselben Auftrag zugeordnet sind, damit keine fremden Abschläge verrechnet werden."}, "erstellt": "2026-08-31T04:00:00Z"}, {"id": "SUP-027", "name": "Empfangene E-Rechnung lässt sich nicht lesen", "kategorie": "Rechnungen, Gutschriften, Mahnungen und E-Rechnung", "bezeichnung": "Eingangs-XRechnung ist reines XML ohne Sichtbeleg, muss importiert werden.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Empfang", "betriebssystem": "Windows", "stufe1": "E-Rechnung", "stufe2": "Empfangene E-Rechnung nicht lesbar", "stufe3": "Eingangsrechnung", "stufe4": "Nur XML-Datei, kein Sichtbeleg", "frage": "Wie öffne ich eine XRechnung von einem Lieferanten?", "stichworte": "e-rechnung empfangen xml lesen eingangsrechnung xrechnung", "loesung": "Eingangsrechnungen › Importieren\nXML wählen\nFakturo erzeugt lesbare Ansicht", "rueckfragen": "Hat die Datei die Endung .xml?", "textbaustein": "Eine XRechnung ist eine reine XML-Datei ohne PDF. Öffnen Sie sie bitte nicht per Doppelklick, sondern über Eingangsrechnungen › Importieren. Fakturo zeigt die Rechnung dann als lesbaren Beleg.", "eskalation": "2nd Level, wenn der Import mit Fehler abbricht.", "begruendung": "Seit 2025 müssen Betriebe E-Rechnungen empfangen können. Die XRechnung enthält nur strukturierte Daten, die Ansicht erzeugt Fakturo beim Import."}, "erstellt": "2026-08-27T03:00:00Z"}, {"id": "SUP-028", "name": "Falsche Mahnstufe oder Mahngebühr", "kategorie": "Rechnungen, Gutschriften, Mahnungen und E-Rechnung", "bezeichnung": "Abweichende Mahnstufen am Kunden überschreiben Standard.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Mahnlauf", "betriebssystem": "Windows", "stufe1": "Mahnung", "stufe2": "Falsche Mahnstufe oder Gebühr", "stufe3": "Rechnung überfällig", "stufe4": "Mahnstufen beim Kunden abweichend eingestellt", "frage": "Warum ist die Mahngebühr falsch?", "stichworte": "mahnstufe mahngebühr mahnung falsch", "loesung": "Einstellungen › Mahnwesen vs. Kunde › Konditionen › Mahnwesen vergleichen\nAm Kunden angleichen\nMahnung stornieren und neu erstellen", "rueckfragen": "Welche Mahnstufen und Gebühren sind mit dem Kunden vereinbart?", "textbaustein": "Bei diesem Kunden sind eigene Mahnstufen hinterlegt, die die Standardwerte überschreiben. Gleichen Sie bitte unter Kunde › Konditionen › Mahnwesen die Werte an und erstellen Sie die Mahnung neu.", "eskalation": "Keine Eskalation.", "begruendung": "Kundenbezogene Mahneinstellungen gehen vor den globalen. Mahngebühren dürfen nur mit vertraglicher Grundlage berechnet werden."}, "erstellt": "2026-08-23T09:00:00Z"}, {"id": "SUP-029", "name": "Überstunden werden falsch berechnet", "kategorie": "Personal, Arbeitszeiten, Urlaub und Zeitkonten", "bezeichnung": "Sollzeit im Arbeitszeitmodell oder Feiertagskalender (Bundesland) falsch.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Monatsabschluss", "betriebssystem": "Windows", "stufe1": "Zeitkonto", "stufe2": "Saldo stimmt nicht", "stufe3": "Einzelne Personen", "stufe4": "Falsches Arbeitszeitmodell oder Feiertagskalender", "frage": "Warum stimmen die Überstunden nicht?", "stichworte": "überstunden falsch sollzeit zeitkonto feiertag", "loesung": "Monatsauswertung der Person öffnen\nPersonal › Person › Arbeitszeitmodell: Sollzeit + Gültig-ab prüfen\nEinstellungen › Feiertage › Bundesland\nZeitkonto für den Monat neu berechnen", "rueckfragen": "Welche Person und welcher Monat sind betroffen?\nWie viele Stunden pro Tag stehen im Arbeitsvertrag?", "textbaustein": "Die Überstunden ergeben sich aus der Sollzeit im Arbeitszeitmodell und dem Feiertagskalender. Prüfen Sie bitte bei der Person das Arbeitszeitmodell (Sollzeit und Gültig-ab-Datum) und unter Einstellungen › Feiertage das Bundesland. Danach das Zeitkonto für den Monat neu berechnen.", "eskalation": "2nd Level, wenn Modell und Feiertage stimmen und der Saldo nach Neuberechnung trotzdem abweicht.", "begruendung": "Saldo = Ist minus Soll. Falsche Sollzeit oder fehlende Feiertage verschieben den Saldo jeden Tag. Ein falsches Gültig-ab-Datum lässt ein altes Modell weiterlaufen."}, "erstellt": "2026-08-19T08:00:00Z"}, {"id": "SUP-030", "name": "Pause wird doppelt abgezogen", "kategorie": "Personal, Arbeitszeiten, Urlaub und Zeitkonten", "bezeichnung": "Automatische Pausenregel zieht zusätzlich zur gestempelten Pause ab.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Monatsabschluss", "betriebssystem": "Windows", "geraet": "Zeiterfassungsterminal", "stufe1": "Pausen", "stufe2": "Pause doppelt abgezogen", "stufe3": "Alle mit Pausenstempelung", "stufe4": "Automatische Pausenregel zieht zusätzlich ab", "frage": "Warum wird meine Pause doppelt abgezogen?", "stichworte": "pause doppelt abgezogen automatisch pausenregel", "loesung": "Arbeitszeitmodell › Pausenregel: „Nur ergänzen, wenn zu wenig Pause gestempelt“\nZeitkonto neu berechnen", "rueckfragen": "Stempeln Ihre Mitarbeitenden die Pause am Terminal?", "textbaustein": "Die automatische Pausenregel zieht derzeit immer ab, auch wenn die Pause gestempelt wurde. Stellen Sie bitte im Arbeitszeitmodell die Pausenregel auf „Nur ergänzen, wenn zu wenig Pause gestempelt“ und berechnen Sie das Zeitkonto neu.", "eskalation": "Keine Eskalation.", "begruendung": "§ 4 ArbZG: 30 Minuten ab 6 Stunden, 45 Minuten ab 9 Stunden. Die Regel soll fehlende Pausen ergänzen, nicht gestempelte doppelt abziehen."}, "erstellt": "2026-08-20T07:00:00Z"}, {"id": "SUP-031", "name": "Monatsabschluss lässt sich nicht durchführen", "kategorie": "Personal, Arbeitszeiten, Urlaub und Zeitkonten", "bezeichnung": "P-404. Unvollständige Buchungen (Kommen ohne Gehen) blockieren den Monatsabschluss.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Monatsabschluss", "betriebssystem": "Windows", "fehlercode": "P-404", "stufe1": "Monatsabschluss", "stufe2": "Abschluss wird verweigert", "stufe3": "Ganzer Betrieb", "stufe4": "Fehlerliste zeigt Kommen ohne Gehen (P-404)", "frage": "Warum klappt der Monatsabschluss nicht?", "stichworte": "monatsabschluss fehlbuchung kommen gehen fehlt", "loesung": "Personal › Fehlerliste\nFehlende Buchungen ergänzen oder als Abwesenheit kennzeichnen\nMonatsabschluss erneut starten", "rueckfragen": "Wie viele Einträge stehen in der Fehlerliste?", "textbaustein": "Der Monatsabschluss ist erst möglich, wenn alle Buchungen vollständig sind. Unter Personal › Fehlerliste sehen Sie, wo zum Beispiel ein „Gehen“ fehlt. Ergänzen Sie diese Buchungen bitte oder kennzeichnen Sie den Tag als Abwesenheit und starten Sie den Abschluss erneut.", "eskalation": "Keine Eskalation. Nach Abschluss sind Korrekturen nur mit Admin-Recht möglich.", "begruendung": "Ein Abschluss mit offenen Buchungen würde falsche Salden festschreiben. Deshalb prüft Fakturo vorher auf Vollständigkeit."}, "erstellt": "2026-08-16T06:00:00Z"}, {"id": "SUP-032", "name": "Urlaub zählt nicht als Arbeitszeit", "kategorie": "Personal, Arbeitszeiten, Urlaub und Zeitkonten", "bezeichnung": "Abwesenheit als „unbezahlt“ statt „Urlaub“/„Krank“ erfasst, keine Sollzeit-Gutschrift.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Monatsabschluss", "betriebssystem": "Windows", "stufe1": "Abwesenheiten", "stufe2": "Stunden fehlen an Abwesenheitstagen", "stufe3": "Einzelne Personen", "stufe4": "Abwesenheitsart „unbezahlt“", "frage": "Warum fehlen Stunden an Urlaubstagen?", "stichworte": "urlaub krank abwesenheit sollzeit gutschrift", "loesung": "Personal › Abwesenheiten der Person: Spalte Art\nArt auf „Urlaub“ oder „Krank“\nZeitkonto neu berechnen", "rueckfragen": "Um welche Person und welche Tage geht es?", "textbaustein": "Die Abwesenheit ist als „unbezahlt“ erfasst, deshalb wird keine Sollzeit gutgeschrieben. Ändern Sie bitte unter Personal › Abwesenheiten die Art auf „Urlaub“ bzw. „Krank“ und berechnen Sie das Zeitkonto neu.", "eskalation": "Keine Eskalation.", "begruendung": "Urlaub und Krankheit schreiben die Sollzeit gut, unbezahlter Urlaub nicht. Die Art bestimmt die Wirkung auf das Zeitkonto."}, "erstellt": "2026-08-12T05:00:00Z"}, {"id": "SUP-033", "name": "Nachtschicht wird an Mitternacht geteilt", "kategorie": "Personal, Arbeitszeiten, Urlaub und Zeitkonten", "bezeichnung": "Kein Tageswechsel im Arbeitszeitmodell, Nachtschicht wird um 0 Uhr geteilt.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Monatsabschluss", "betriebssystem": "Windows", "stufe1": "Zeitkonto", "stufe2": "Schicht über Mitternacht wird geteilt", "stufe3": "Personen im Nachtdienst", "stufe4": "Arbeitszeitmodell ohne Nachtschicht-Regel", "frage": "Warum wird meine Nachtschicht geteilt?", "stichworte": "nachtschicht mitternacht geteilt nachtdienst", "loesung": "Arbeitszeitmodell › Tageswechsel auf 6:00\nZeitkonto neu berechnen", "rueckfragen": "Von wann bis wann gehen die Nachtschichten?", "textbaustein": "Ohne Nachtschicht-Regel endet jeder Arbeitstag um 0 Uhr, deshalb erscheint eine Schicht von 22 bis 6 Uhr als zwei Tage. Stellen Sie bitte im Arbeitszeitmodell den Tageswechsel auf 6:00 Uhr und berechnen Sie das Zeitkonto neu.", "eskalation": "Keine Eskalation.", "begruendung": "Typisch im Wachdienst. Mit Tageswechsel nach Schichtende wird die Schicht dem Starttag zugeordnet, Sollzeit und Pausen stimmen dann."}, "erstellt": "2026-08-08T04:00:00Z"}, {"id": "SUP-034", "name": "Resturlaub ist falsch", "kategorie": "Personal, Arbeitszeiten, Urlaub und Zeitkonten", "bezeichnung": "Jahreswechsel nicht durchgeführt, Resturlaub nicht übertragen.", "zusatz": {"produkt": "Fakturo", "wann": "Zum Jahreswechsel", "betriebssystem": "Windows", "stufe1": "Abwesenheiten", "stufe2": "Resturlaub falsch", "stufe3": "Alle Personen", "stufe4": "Jahreswechsel nicht durchgeführt", "frage": "Warum fehlt mein Resturlaub?", "stichworte": "resturlaub urlaubskonto jahreswechsel", "loesung": "Personal › Jahreswechsel durchführen\nUrlaubskonten prüfen\nVerfallsregeln (z. B. 31.03.) in den Einstellungen prüfen", "rueckfragen": "Sind Verfallsregeln für Resturlaub vereinbart?", "textbaustein": "Der Resturlaub wird erst mit dem Jahreswechsel übertragen. Führen Sie bitte unter Personal › Jahreswechsel den Jahreswechsel durch und prüfen Sie danach die Urlaubskonten.", "eskalation": "Keine Eskalation.", "begruendung": "Der Jahreswechsel ist bewusst ein manueller Schritt, damit Korrekturen am Vorjahr vorher abgeschlossen werden können."}, "erstellt": "2026-08-04T03:00:00Z"}, {"id": "SUP-035", "name": "Terminal ist offline, Zeiten kommen nicht an", "kategorie": "Zeiterfassungsterminals, Chips und Ausweise", "bezeichnung": "T-01. Terminal erreicht Terminalserver nicht, Buchungen liegen im Gerätespeicher.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Stempeln", "geraet": "Zeiterfassungsterminal", "fehlercode": "T-01", "stufe1": "Verbindung", "stufe2": "Zeiten kommen nicht an", "stufe3": "Ein Terminal", "stufe4": "Display zeigt „Offline“ (T-01)", "frage": "Warum kommen die Zeiten vom Terminal nicht an?", "stichworte": "terminal offline verbindung netzwerk zeiten fehlen", "loesung": "Display „Offline“? Kabel + Link-LED prüfen\nGeräte › Terminals › Verbindung testen\nDienst „Fakturo Terminalserver“ läuft?\n„Buchungen abholen“\nAlle Terminals offline: SUP-040", "rueckfragen": "Was zeigt das Display genau?\nLeuchtet die LED am Netzwerkanschluss?\nSind andere Terminals ebenfalls offline?", "textbaustein": "Das Terminal hat keine Verbindung zum Fakturo-Server. Die Buchungen bleiben im Terminal gespeichert, es geht nichts verloren. Prüfen Sie bitte das Netzwerkkabel und testen Sie unter Geräte › Terminals die Verbindung. Sobald das Terminal wieder online ist, wählen Sie „Buchungen abholen“.", "eskalation": "2nd Level, wenn Netz und Dienst in Ordnung sind und der Verbindungstest trotzdem scheitert.", "begruendung": "Das Terminal puffert ca. 10.000 Buchungen. Häufigste Ursachen: Kabel/Switch-Port, geänderte IP, gestoppter Terminaldienst."}, "erstellt": "2026-08-05T09:00:00Z"}, {"id": "SUP-036", "name": "Chip wird am Terminal nicht erkannt", "kategorie": "Zeiterfassungsterminals, Chips und Ausweise", "bezeichnung": "T-12. Chip keiner Person zugeordnet oder falscher Chiptyp (125 kHz statt MIFARE).", "zusatz": {"produkt": "Fakturo", "wann": "Beim Stempeln", "geraet": "RFID-Chip / Ausweis", "fehlercode": "T-12", "stufe1": "Chip oder Ausweis", "stufe2": "Chip wird abgelehnt", "stufe3": "Eine Person", "stufe4": "Terminal meldet „Unbekannter Ausweis“ (T-12)", "frage": "Warum wird mein Chip nicht erkannt?", "stichworte": "chip nicht erkannt ausweis karte rfid unbekannt", "loesung": "Personal › Person › Ausweisnummer prüfen\nAnderen Chip testen\nChip im Lernmodus am Terminal einlesen + zuordnen\nChiptyp mit Terminalangaben vergleichen", "rueckfragen": "Ist es ein neuer oder ein Ersatzchip?\nFunktioniert ein anderer Chip am selben Terminal?", "textbaustein": "Das Terminal kennt den Chip nicht. Bitte prüfen Sie bei der Person die Ausweisnummer und lesen Sie den Chip bei Bedarf im Lernmodus am Terminal ein. Ersatzchips müssen denselben Typ haben wie die bisherigen.", "eskalation": "2nd Level, wenn kein Chip mehr gelesen wird (Leser defekt).", "begruendung": "Leser unterstützen nur bestimmte Chiptypen. Ein Chip falschen Typs wird gar nicht gelesen, ein unbekannter Chip richtigen Typs liefert T-12."}, "erstellt": "2026-08-01T08:00:00Z"}, {"id": "SUP-037", "name": "Uhrzeit am Terminal ist falsch", "kategorie": "Zeiterfassungsterminals, Chips und Ausweise", "bezeichnung": "Kein NTP eingetragen, Zeitumstellung fehlt, Abweichung 1 h.", "zusatz": {"produkt": "Fakturo", "wann": "Nach Zeitumstellung", "geraet": "Zeiterfassungsterminal", "stufe1": "Uhrzeit", "stufe2": "Uhrzeit falsch", "stufe3": "Alle Terminals", "stufe4": "Abweichung genau eine Stunde", "frage": "Warum zeigt das Terminal die falsche Uhrzeit?", "stichworte": "uhrzeit falsch sommerzeit winterzeit terminal ntp", "loesung": "Geräte › Terminals › Einstellungen › NTP eintragen\n„Uhrzeit senden“\nBuchungen seit Umstellung mit „Zeiten verschieben“ korrigieren", "rueckfragen": "Seit wann ist die Uhrzeit falsch?\nBetrifft es alle Terminals?", "textbaustein": "Am Terminal ist kein Zeitserver eingetragen, deshalb wurde die Zeitumstellung nicht übernommen. Tragen Sie bitte unter Geräte › Terminals › Einstellungen einen Zeitserver ein und wählen Sie „Uhrzeit senden“. Buchungen seit der Umstellung können Sie mit „Zeiten verschieben“ korrigieren.", "eskalation": "Keine Eskalation.", "begruendung": "Ohne NTP läuft die interne Uhr frei und übernimmt keine Sommer-/Winterzeit. Nach Stromausfall kann sie ebenfalls zurückspringen."}, "erstellt": "2026-07-28T07:00:00Z"}, {"id": "SUP-038", "name": "Doppelte Buchungen nach zweimal Vorhalten", "kategorie": "Zeiterfassungsterminals, Chips und Ausweise", "bezeichnung": "Keine Sperrzeit am Terminal, doppeltes Vorhalten erzeugt Kommen + Gehen in einer Minute.", "zusatz": {"produkt": "Fakturo", "wann": "Beim Stempeln", "geraet": "Zeiterfassungsterminal", "stufe1": "Buchungen", "stufe2": "Doppelte Buchungen", "stufe3": "Einzelne Personen", "stufe4": "Kommen und Gehen in derselben Minute", "frage": "Woher kommen doppelte Buchungen?", "stichworte": "doppelt buchung zweimal gestempelt sperrzeit", "loesung": "Geräte › Terminals › Sperrzeit 2 Min.\nDoppelte Buchungen in der Buchungsliste löschen\nSperrzeit nicht über 5 Min.", "rueckfragen": "Welche Personen und Tage sind betroffen?", "textbaustein": "Wird der Chip kurz hintereinander zweimal vorgehalten, entstehen Kommen und Gehen in derselben Minute. Setzen Sie bitte unter Geräte › Terminals eine Sperrzeit von 2 Minuten und löschen Sie die doppelten Buchungen in der Buchungsliste.", "eskalation": "Keine Eskalation.", "begruendung": "Die Sperrzeit ignoriert eine zweite Buchung derselben Person im Zeitraum. Zu lange Sperrzeiten verhindern echte kurze Unterbrechungen."}, "erstellt": "2026-07-24T06:00:00Z"}, {"id": "SUP-039", "name": "Neue Person kann nicht stempeln", "kategorie": "Zeiterfassungsterminals, Chips und Ausweise", "bezeichnung": "T-12 bei neuer Person. Stammdaten noch nicht ans Terminal gesendet.", "zusatz": {"produkt": "Fakturo", "wann": "Nach dem Anlegen", "geraet": "Zeiterfassungsterminal", "fehlercode": "T-12", "stufe1": "Chip oder Ausweis", "stufe2": "Neue Person kann nicht stempeln", "stufe3": "Eine Person", "stufe4": "Terminal meldet „Unbekannter Ausweis“ (T-12)", "frage": "Warum kann ein neuer Mitarbeiter nicht stempeln?", "stichworte": "neuer mitarbeiter terminal stempeln personal übertragen", "loesung": "Person + Ausweis prüfen\nGeräte › Terminals › „Stammdaten senden“\nTestbuchung\nNächtliche Übertragung aktivieren", "rueckfragen": "Wann wurde die Person angelegt?", "textbaustein": "Neue Mitarbeitende kennt das Terminal erst, wenn die Stammdaten übertragen wurden. Wählen Sie bitte unter Geräte › Terminals „Stammdaten senden“ und lassen Sie eine Testbuchung machen. In den Einstellungen können Sie die automatische nächtliche Übertragung aktivieren.", "eskalation": "Keine Eskalation.", "begruendung": "Terminals arbeiten mit einer lokalen Personenliste, damit sie auch offline buchen können. Änderungen müssen deshalb übertragen werden."}, "erstellt": "2026-07-20T05:00:00Z"}, {"id": "SUP-040", "name": "Alle Terminals sind offline", "kategorie": "Zeiterfassungsterminals, Chips und Ausweise", "bezeichnung": "T-01 an allen Terminals. Dienst „Fakturo Terminalserver“ läuft nicht (meist nach Windows-Update/Neustart).", "zusatz": {"produkt": "Fakturo", "wann": "Beim Stempeln", "geraet": "Zeiterfassungsterminal", "fehlercode": "T-01", "stufe1": "Verbindung", "stufe2": "Zeiten kommen nicht an", "stufe3": "Alle Terminals", "stufe4": "Dienst „Fakturo Terminalserver“ läuft nicht", "frage": "Warum sind alle Terminals offline?", "stichworte": "alle terminals offline server dienst", "loesung": "Server › Dienste: „Fakturo Terminalserver“ starten\nStarttyp „Automatisch (verzögert)“\nEreignisanzeige auf Fehler prüfen\nFakturo › „Buchungen abholen“", "rueckfragen": "Wurde der Server kürzlich neu gestartet oder aktualisiert?\nHat jemand vor Ort Zugriff auf den Server?", "textbaustein": "Alle Terminals sind offline, weil der Dienst „Fakturo Terminalserver“ auf Ihrem Server nicht läuft. Bitte starten Sie ihn unter Dienste und stellen Sie den Starttyp auf „Automatisch (verzögert)“. Danach in Fakturo „Buchungen abholen“ wählen. Es gehen keine Buchungen verloren.", "eskalation": "2nd Level, wenn der Dienst nicht startet oder sofort wieder stoppt (Ereignisanzeige mitschicken).", "begruendung": "Nach Updates startet der Dienst teils vor dem Netzwerk bzw. der Datenbank und beendet sich. Verzögerter Start behebt das."}, "erstellt": "2026-07-21T04:00:00Z"}, {"id": "SUP-041", "name": "Terminal reagiert nicht, Display dunkel", "kategorie": "Zeiterfassungsterminals, Chips und Ausweise", "bezeichnung": "Display dunkel, keine Stromversorgung (meist PoE vom Switch).", "zusatz": {"produkt": "Fakturo", "wann": "Beim Stempeln", "geraet": "Zeiterfassungsterminal", "stufe1": "Gerät", "stufe2": "Terminal reagiert nicht", "stufe3": "Ein Terminal", "stufe4": "Display bleibt dunkel", "frage": "Was tun, wenn das Terminal dunkel bleibt?", "stichworte": "terminal dunkel aus strom reagiert nicht", "loesung": "LED am Switch-Port prüfen\nAnderen Port testen\nNetzteil prüfen, falls vorhanden\n30 Sek. stromlos, neu starten", "rueckfragen": "Leuchtet am Switch-Port eine LED?\nWurde am Netzwerk etwas umgebaut?", "textbaustein": "Das Terminal bekommt offenbar keinen Strom. Es wird in der Regel über das Netzwerkkabel versorgt. Stecken Sie das Kabel bitte am Switch auf einen anderen Port und machen Sie das Terminal 30 Sekunden stromlos.", "eskalation": "2nd Level für Austauschgerät, wenn das Display nach Port- und Netzteilwechsel dunkel bleibt.", "begruendung": "PoE-Ports können abgeschaltet sein oder das Leistungsbudget des Switches reicht nicht. Ein Portwechsel grenzt das schnell ein."}, "erstellt": "2026-07-17T03:00:00Z"}, {"id": "SUP-042", "name": "Buchungen fehlen nach Stromausfall", "kategorie": "Zeiterfassungsterminals, Chips und Ausweise", "bezeichnung": "Terminal war während Stromausfall aus, keine Buchungen in dem Zeitraum.", "zusatz": {"produkt": "Fakturo", "wann": "Nach Stromausfall", "geraet": "Zeiterfassungsterminal", "stufe1": "Buchungen", "stufe2": "Buchungen fehlen", "stufe3": "Ein Terminal", "stufe4": "Lücke zur Zeit des Stromausfalls", "frage": "Warum fehlen Buchungen nach einem Stromausfall?", "stichworte": "stromausfall buchungen fehlen terminal", "loesung": "Zeitraum der Lücke ermitteln (Ereignisprotokoll des Terminals)\nFehlende Zeiten als Korrektur, Grund „Stromausfall“", "rueckfragen": "Wann genau war der Stromausfall?\nWer war in der Zeit anwesend?", "textbaustein": "Während des Stromausfalls war das Terminal aus und konnte keine Buchungen annehmen. Tragen Sie die fehlenden Zeiten bitte als Korrektur mit dem Grund „Stromausfall“ nach.", "eskalation": "Keine Eskalation.", "begruendung": "Buchungen vor dem Ausfall bleiben im Speicher. Was während des Ausfalls nicht gestempelt wurde, existiert nicht und muss korrigiert werden."}, "erstellt": "2026-07-13T09:00:00Z"}, {"id": "SUP-043", "name": "Gestempelte Zeiten aus der App fehlen", "kategorie": "Online-Zeiterfassung im Browser und in der App", "bezeichnung": "Offline-Stempelungen noch auf dem Handy, nicht synchronisiert.", "zusatz": {"produkt": "Fakturo Zeit", "wann": "Nach dem Stempeln", "betriebssystem": "Android", "geraet": "Smartphone", "stufe1": "Stempeln in der App", "stufe2": "Zeiten fehlen", "stufe3": "Smartphone", "stufe4": "App zeigt nicht synchronisierte Buchungen", "frage": "Warum fehlen meine Zeiten aus der App?", "stichworte": "app stempeln offline zeiten fehlen synchronisieren", "loesung": "App online öffnen, Wolkensymbol prüfen\n„Synchronisieren“\nBrowser › „Meine Zeiten“ prüfen\nNicht neu installieren vor Sync", "rueckfragen": "Zeigt die App oben ein Wolkensymbol mit Zahl?\nIst mobile Datennutzung für die App erlaubt?", "textbaustein": "Die Stempelungen wurden ohne Netz auf dem Handy gespeichert und noch nicht übertragen. Öffnen Sie bitte die App mit Internetverbindung und tippen Sie oben auf „Synchronisieren“. Wichtig: Die App vorher nicht neu installieren, sonst gehen die Zeiten verloren.", "eskalation": "2nd Level, wenn die Synchronisation mit Fehler abbricht.", "begruendung": "Fakturo Zeit speichert offline lokal und überträgt beim nächsten Online-Start. Eine Neuinstallation löscht den lokalen Speicher."}, "erstellt": "2026-07-09T08:00:00Z"}, {"id": "SUP-044", "name": "Standort wird beim Stempeln nicht erfasst", "kategorie": "Online-Zeiterfassung im Browser und in der App", "bezeichnung": "Standortberechtigung fehlt oder nur „einmal“ erteilt.", "zusatz": {"produkt": "Fakturo Zeit", "wann": "Beim Stempeln", "betriebssystem": "iOS", "geraet": "Smartphone", "stufe1": "Stempeln in der App", "stufe2": "Standort fehlt", "stufe3": "Smartphone", "stufe4": "Standortberechtigung nicht auf „Beim Verwenden“", "frage": "Warum wird beim Stempeln kein Standort gespeichert?", "stichworte": "gps standort ort fehlt berechtigung", "loesung": "Handy › Einstellungen › Fakturo Zeit › Standort: „Beim Verwenden der App“\nGenauen Standort an", "rueckfragen": "Welches Handy bzw. Betriebssystem nutzt die Person?", "textbaustein": "Die App hat keine dauerhafte Berechtigung für den Standort. Bitte in den Handy-Einstellungen unter Fakturo Zeit › Standort „Beim Verwenden der App“ wählen und „Genauer Standort“ einschalten.", "eskalation": "Keine Eskalation. Betriebsvereinbarung zur Standorterfassung klärt der Kunde.", "begruendung": "iOS und Android vergeben Standortrechte pro App. „Nur einmal“ gilt nur bis zum Schließen der App."}, "erstellt": "2026-07-05T07:00:00Z"}, {"id": "SUP-045", "name": "Vergessene Stempelung nachtragen", "kategorie": "Online-Zeiterfassung im Browser und in der App", "bezeichnung": "Mitarbeitende dürfen nur Korrekturanträge stellen, keine direkte Änderung.", "zusatz": {"produkt": "Fakturo Zeit", "wann": "Nach dem Stempeln", "betriebssystem": "Web", "stufe1": "Zeiten korrigieren", "stufe2": "Vergessene Stempelung", "stufe3": "Browser oder App", "stufe4": "Kein Bearbeiten-Symbol am Tag", "frage": "Wie trage ich eine vergessene Stempelung nach?", "stichworte": "stempelung nachtragen vergessen korrektur antrag", "loesung": "„Meine Zeiten“ › Tag › „Korrektur beantragen“ mit Uhrzeit + Grund\nVorgesetzte Person gibt frei\nMonat abgeschlossen: nur Verwaltung", "rueckfragen": "Ist der Monat schon abgeschlossen?", "textbaustein": "Mitarbeitende können Zeiten nicht direkt ändern, aber eine Korrektur beantragen. Dazu unter „Meine Zeiten“ den Tag wählen, „Korrektur beantragen“ antippen und Uhrzeit sowie Grund eintragen. Die vorgesetzte Person gibt den Antrag dann frei.", "eskalation": "Keine Eskalation.", "begruendung": "Das Antragsverfahren sorgt dafür, dass Korrekturen nachvollziehbar und freigegeben sind (Arbeitszeitdokumentation)."}, "erstellt": "2026-07-06T06:00:00Z"}, {"id": "SUP-046", "name": "Online-Zeiten kommen nicht in Fakturo an", "kategorie": "Online-Zeiterfassung im Browser und in der App", "bezeichnung": "S-409. Personalnummer in Fakturo Zeit ≠ Fakturo, Abgleich kann nicht zuordnen.", "zusatz": {"produkt": "Fakturo Zeit", "wann": "Beim Abgleich", "betriebssystem": "Web", "fehlercode": "S-409", "stufe1": "Übergabe an Fakturo", "stufe2": "Online-Zeiten fehlen in Fakturo", "stufe3": "Server (Abgleich)", "stufe4": "Fehlerliste meldet S-409", "frage": "Warum erscheinen Online-Zeiten nicht in der Rechnungssoftware?", "stichworte": "schnittstelle abgleich personalnummer zeiten übertragen fakturo", "loesung": "Fakturo Zeit › Verwaltung › Abgleich › Fehlerliste\nPersNr angleichen (Fakturo ist führend)\n„Erneut übertragen“", "rueckfragen": "Welche Personen stehen in der Fehlerliste des Abgleichs?", "textbaustein": "Die Zeiten konnten nicht übertragen werden, weil die Personalnummer in Fakturo Zeit nicht mit der in Fakturo übereinstimmt. Gleichen Sie die Nummer bitte an (Fakturo ist führend) und wählen Sie im Abgleich „Erneut übertragen“.", "eskalation": "Keine Eskalation.", "begruendung": "Der Abgleich ordnet Personen ausschließlich über die Personalnummer zu. Abweichende Nummern landen in der Fehlerliste statt bei falschen Personen."}, "erstellt": "2026-07-02T05:00:00Z"}, {"id": "SUP-047", "name": "Einladungslink ist abgelaufen", "kategorie": "Online-Zeiterfassung im Browser und in der App", "bezeichnung": "Einladungslink älter als 7 Tage.", "zusatz": {"produkt": "Fakturo Zeit", "wann": "Beim Anmelden", "betriebssystem": "Web", "stufe1": "Zugang", "stufe2": "Einladung funktioniert nicht", "stufe3": "Browser oder App", "stufe4": "Link ist älter als 7 Tage", "frage": "Was tun, wenn der Einladungslink nicht mehr geht?", "stichworte": "einladung link abgelaufen registrieren", "loesung": "Verwaltung › Personen › „Einladung erneut senden“\nE-Mail-Adresse auf Tippfehler prüfen\nSpam-Ordner", "rueckfragen": "Stimmt die hinterlegte E-Mail-Adresse?", "textbaustein": "Einladungen zu Fakturo Zeit sind 7 Tage gültig. Senden Sie die Einladung bitte unter Verwaltung › Personen erneut. Falls sie nicht ankommt, bitte auch den Spam-Ordner prüfen.", "eskalation": "Keine Eskalation.", "begruendung": "Die Gültigkeit ist aus Sicherheitsgründen begrenzt, weil der Link ohne Passwort zum Konto führt."}, "erstellt": "2026-06-28T04:00:00Z"}, {"id": "SUP-048", "name": "Stempeln nicht möglich, Knopf ist grau", "kategorie": "Online-Zeiterfassung im Browser und in der App", "bezeichnung": "Geofence aktiv, Person außerhalb des Stempelbereichs.", "zusatz": {"produkt": "Fakturo Zeit", "wann": "Beim Stempeln", "betriebssystem": "Android", "geraet": "Smartphone", "stufe1": "Stempeln in der App", "stufe2": "Stempeln nicht möglich", "stufe3": "Smartphone", "stufe4": "Außerhalb des erlaubten Standorts (Geofence)", "frage": "Warum kann ich in der App nicht stempeln?", "stichworte": "stempeln grau knopf geofence bereich", "loesung": "Standort in der App prüfen\nVerwaltung › Person › Stempelbereiche anpassen (Radius ≥ 150 m)\nApp neu öffnen", "rueckfragen": "Wo befindet sich die Person beim Stempeln?", "textbaustein": "Für die Person ist ein Stempelbereich eingerichtet, und sie befindet sich außerhalb davon. Prüfen Sie bitte unter Verwaltung › Person › Stempelbereiche den Bereich und vergrößern Sie ihn bei Bedarf. Danach die App neu öffnen.", "eskalation": "Keine Eskalation.", "begruendung": "GPS ist in Gebäuden ungenau. Radien unter 150 m führen zu grauen Knöpfen, obwohl die Person vor Ort ist."}, "erstellt": "2026-06-24T03:00:00Z"}, {"id": "SUP-049", "name": "Korrekturantrag bleibt offen", "kategorie": "Online-Zeiterfassung im Browser und in der App", "bezeichnung": "Keine vorgesetzte Person hinterlegt, Antrag landet bei niemandem.", "zusatz": {"produkt": "Fakturo Zeit", "wann": "Nach dem Stempeln", "betriebssystem": "Web", "stufe1": "Zeiten korrigieren", "stufe2": "Antrag bleibt offen", "stufe3": "Browser", "stufe4": "Keine vorgesetzte Person hinterlegt", "frage": "Warum wird mein Korrekturantrag nicht bearbeitet?", "stichworte": "korrekturantrag offen freigabe vorgesetzter", "loesung": "Verwaltung › Person › Vorgesetzte eintragen\nVerwaltung › Anträge: offenen Antrag freigeben\nVertretung einrichten", "rueckfragen": "Wer soll die Anträge dieser Person freigeben?", "textbaustein": "Für die Person ist keine vorgesetzte Person hinterlegt, deshalb sieht niemand den Antrag. Tragen Sie bitte unter Verwaltung › Person eine vorgesetzte Person ein und geben Sie den offenen Antrag unter Verwaltung › Anträge frei.", "eskalation": "Keine Eskalation.", "begruendung": "Anträge werden nur der hinterlegten vorgesetzten Person bzw. deren Vertretung angezeigt."}, "erstellt": "2026-06-20T09:00:00Z"}, {"id": "SUP-050", "name": "Kontrollpunkt lässt sich nicht scannen", "kategorie": "Wächterkontrolle: Rundgänge, Kontrollpunkte und Alarme", "bezeichnung": "NFC aus, Hülle stört oder Tag defekt.", "zusatz": {"produkt": "Fakturo Rundgang", "wann": "Beim Rundgang", "betriebssystem": "Android", "geraet": "NFC-Kontrollpunkt", "stufe1": "Kontrollpunkt", "stufe2": "Scan funktioniert nicht", "stufe3": "Wachperson vor Ort", "stufe4": "Handy liest gar kein Tag oder nur dieses nicht", "frage": "Warum kann ich einen Kontrollpunkt nicht scannen?", "stichworte": "kontrollpunkt scannen nfc tag lesen checkpoint", "loesung": "Andere Tags lesbar? Nein: Handy (NFC an, Hülle ab). Ja: Tag defekt\nRückseite mittig ans Tag\nPunkt in der App als „nicht lesbar“ melden, mit Foto\nTag ersetzen", "rueckfragen": "Werden andere Kontrollpunkte gelesen?\nWelches Handy wird verwendet?", "textbaustein": "Bitte prüfen Sie, ob NFC am Handy eingeschaltet ist, nehmen Sie die Hülle ab und halten Sie die Rückseite mittig an das Tag. Funktioniert nur dieses eine Tag nicht, melden Sie den Punkt in der App als „nicht lesbar“ mit Foto. Das Tag wird dann ersetzt.", "eskalation": "Keine Eskalation.", "begruendung": "Liest das Handy gar kein Tag, liegt es am Handy. Nur ein Tag: Tag beschädigt oder auf Metall montiert."}, "erstellt": "2026-06-21T08:00:00Z"}, {"id": "SUP-051", "name": "Rundgang als verspätet markiert", "kategorie": "Wächterkontrolle: Rundgänge, Kontrollpunkte und Alarme", "bezeichnung": "Start außerhalb Zeitfenster (Toleranz 10 Min.) oder Handyuhr weicht ab.", "zusatz": {"produkt": "Fakturo Rundgang", "wann": "Beim Rundgang", "betriebssystem": "Android", "geraet": "Wächter-Smartphone", "stufe1": "Zeitplan", "stufe2": "Rundgang als verspätet markiert", "stufe3": "Leitstelle im Bericht", "stufe4": "Handyuhr weicht ab oder Start nach Toleranz", "frage": "Warum steht mein Rundgang auf verspätet?", "stichworte": "rundgang verspätet zeitfenster toleranz zu spät", "loesung": "Bericht: Scanzeiten prüfen\nHandy: Uhrzeit automatisch\nLeitstelle › Rundgangsplan › Toleranz prüfen", "rueckfragen": "Zu welcher Uhrzeit wurde der Rundgang gestartet?\nIst die Uhrzeit am Handy auf automatisch?", "textbaustein": "Der Rundgang gilt als verspätet, wenn er außerhalb des Zeitfensters (Standard 10 Minuten Toleranz) startet oder die Handyuhr abweicht. Stellen Sie die Uhrzeit am Handy bitte auf automatisch und prüfen Sie in der Leitstelle die Toleranz im Rundgangsplan.", "eskalation": "Keine Eskalation. Toleranzen sind oft im Vertrag mit dem Auftraggeber festgelegt.", "begruendung": "Die App stempelt mit der Handyzeit. Eine manuell gestellte Uhr verschiebt alle Scans."}, "erstellt": "2026-06-17T07:00:00Z"}, {"id": "SUP-052", "name": "Geplanter Rundgang fehlt in der App", "kategorie": "Wächterkontrolle: Rundgänge, Kontrollpunkte und Alarme", "bezeichnung": "Rundgangsplan nicht dem Objekt/der Schicht zugewiesen.", "zusatz": {"produkt": "Fakturo Rundgang", "wann": "Bei Schichtbeginn", "betriebssystem": "Android", "geraet": "Wächter-Smartphone", "stufe1": "Zeitplan", "stufe2": "Rundgang wird nicht angezeigt", "stufe3": "Wachperson vor Ort", "stufe4": "Plan ist der Schicht nicht zugewiesen", "frage": "Warum sehe ich meinen Rundgang nicht in der App?", "stichworte": "rundgang fehlt app nicht sichtbar plan zuweisen", "loesung": "Leitstelle › Rundgangspläne: Objekt + Schicht zuweisen\nDienstplan der Person prüfen\nApp nach unten ziehen zum Aktualisieren", "rueckfragen": "Welches Objekt und welche Schicht?", "textbaustein": "Der Rundgang ist dem Objekt oder der Schicht der Person nicht zugewiesen. Bitte unter Leitstelle › Rundgangspläne Objekt und Schicht zuweisen und danach in der App zum Aktualisieren nach unten ziehen.", "eskalation": "Keine Eskalation.", "begruendung": "Die App zeigt nur Pläne, die zur aktuellen Schicht und zum Objekt der Person passen."}, "erstellt": "2026-06-13T06:00:00Z"}, {"id": "SUP-053", "name": "Kein Alarm bei ausgelassenem Kontrollpunkt", "kategorie": "Wächterkontrolle: Rundgänge, Kontrollpunkte und Alarme", "bezeichnung": "Keine Benachrichtigung „Kontrollpunkt verpasst“ im Plan eingerichtet.", "zusatz": {"produkt": "Fakturo Rundgang", "wann": "Beim Rundgang", "betriebssystem": "Web", "stufe1": "Alarme", "stufe2": "Kein Alarm bei verpasstem Punkt", "stufe3": "Leitstelle", "stufe4": "Benachrichtigung im Plan aus", "frage": "Warum bekomme ich keine Meldung, wenn ein Kontrollpunkt fehlt?", "stichworte": "alarm benachrichtigung ausgelassen kontrollpunkt eskalation leitstelle", "loesung": "Leitstelle › Rundgangsplan › Benachrichtigungen: „Kontrollpunkt verpasst“ an\nEmpfänger + Kanal (E-Mail, SMS, Leitstelle)", "rueckfragen": "Wer soll bei einem verpassten Punkt alarmiert werden und wie?", "textbaustein": "Für den Rundgang ist keine Benachrichtigung eingerichtet, deshalb stehen ausgelassene Punkte nur im Bericht. Aktivieren Sie bitte unter Leitstelle › Rundgangsplan › Benachrichtigungen „Kontrollpunkt verpasst“ und tragen Sie die Empfänger ein.", "eskalation": "Sicherheitsrelevant: bei Unklarheit sofort 2nd Level.", "begruendung": "Benachrichtigungen sind pro Plan konfigurierbar und standardmäßig aus, weil Empfänger und Kanal je Objekt verschieden sind."}, "erstellt": "2026-06-09T05:00:00Z"}, {"id": "SUP-054", "name": "Totmann-Alarm löst ständig aus", "kategorie": "Wächterkontrolle: Rundgänge, Kontrollpunkte und Alarme", "bezeichnung": "Ruhezeit des Alleinarbeiterschutzes zu kurz, Fehlalarme bei Ruhe.", "zusatz": {"produkt": "Fakturo Rundgang", "wann": "Beim Rundgang", "betriebssystem": "Android", "geraet": "Wächter-Smartphone", "stufe1": "Alarme", "stufe2": "Fehlalarme", "stufe3": "Leitstelle", "stufe4": "Totmann-Alarm bei Ruhe im Fahrzeug oder beim Sitzen", "frage": "Warum löst der Totmann-Alarm so oft aus?", "stichworte": "totmann alarm alleinarbeiter bewegung lage fehlalarm", "loesung": "Alarmprotokoll prüfen\nLeitstelle › Objekt › Alleinarbeiterschutz: Ruhezeit bis Voralarm z. B. 5 Min.\nVoralarm am Handy bestätigen lassen\nNie ganz abschalten", "rueckfragen": "In welchen Situationen kommen die Alarme (Fahrzeug, Pförtnerloge)?", "textbaustein": "Der Alleinarbeiterschutz meldet Alarm, wenn sich das Handy eine Zeit lang nicht bewegt. Verlängern Sie bitte unter Leitstelle › Objekt › Alleinarbeiterschutz die Ruhezeit bis zum Voralarm, zum Beispiel auf 5 Minuten. Bitte den Schutz nicht ganz ausschalten.", "eskalation": "2nd Level, wenn Alarme auch bei Bewegung kommen (Sensorproblem).", "begruendung": "Der Voralarm gibt der Person Gelegenheit zu bestätigen. Erst ohne Bestätigung wird an die Leitstelle gemeldet."}, "erstellt": "2026-06-05T04:00:00Z"}, {"id": "SUP-055", "name": "Neuen Kontrollpunkt anlegen", "kategorie": "Wächterkontrolle: Rundgänge, Kontrollpunkte und Alarme", "bezeichnung": "Neuer Kontrollpunkt: Tag muss einmal angelernt und zugeordnet werden.", "zusatz": {"produkt": "Fakturo Rundgang", "wann": "Beim Einrichten", "betriebssystem": "Android", "geraet": "NFC-Kontrollpunkt", "stufe1": "Kontrollpunkt", "stufe2": "Neuer Punkt soll angelegt werden", "stufe3": "Objektleitung", "stufe4": "Tag ist noch nicht angelernt", "frage": "Wie lege ich einen neuen Kontrollpunkt an?", "stichworte": "kontrollpunkt anlegen neu tag qr anlernen", "loesung": "Recht „Kontrollpunkte anlernen“ prüfen\nApp (Objektleitung) › „Kontrollpunkte anlernen“ › scannen + benennen\nLeitstelle: Punkt in Rundgangsplan aufnehmen", "rueckfragen": "Welcher Tag-Typ wird verwendet (NFC, QR, Barcode)?", "textbaustein": "Neue Kontrollpunkte müssen einmal angelernt werden. Wählen Sie bitte in der App als Objektleitung „Kontrollpunkte anlernen“, scannen Sie das Tag und vergeben Sie einen Namen. Danach nehmen Sie den Punkt in der Leitstelle in den Rundgangsplan auf.", "eskalation": "Keine Eskalation.", "begruendung": "Tags haben eine eindeutige Kennung, die  des Objekt-Bundeslands", "rueckfragen": "Welche Zeiten gelten am Wochenende und an Feiertagen?", "textbaustein": "Für Wochenende und Feiertage ist kein eigener Plan hinterlegt, deshalb gilt der Werktagsplan. Legen Sie bitte unter Leitstelle › Rundgangspläne einen Wochenend- und Feiertagsplan an.", "eskalation": "Keine Eskalation.", "begruendung": "Pläne haben Gültigkeiten nach Wochentag. Feiertage richten sich nach dem Bundesland des Objekts."}, "erstellt": "2026-05-29T08:00:00Z"}, {"id": "SUP-058", "name": "Wachbuch-Eintrag lässt sich nicht ändern", "kategorie": "Digitales Wachbuch: Einträge, Schichtübergabe und Berichte", "bezeichnung": "Wachbuch revisionssicher, nach Speichern nur Nachtrag.", "zusatz": {"produkt": "Fakturo Wachbuch", "wann": "Nach dem Speichern", "betriebssystem": "Web", "stufe1": "Einträge", "stufe2": "Eintrag lässt sich nicht ändern", "stufe3": "Nach dem Speichern", "stufe4": "Nur „Nachtrag“ wird angeboten", "frage": "Warum kann ich einen Wachbuch-Eintrag nicht bearbeiten?", "stichworte": "wachbuch eintrag ändern bearbeiten nachtrag revisionssicher", "loesung": "Eintrag › „Nachtrag hinzufügen“\nKorrektur beschreiben + speichern\nKeine Löschung über den Support", "rueckfragen": "Was genau soll korrigiert werden?", "textbaustein": "Wachbuch-Einträge sind revisionssicher und können nach dem Speichern nicht mehr geändert werden. Bitte öffnen Sie den Eintrag, wählen Sie „Nachtrag hinzufügen“ und beschreiben Sie die Korrektur. Die Originalfassung bleibt sichtbar.", "eskalation": "Keine Eskalation. Löschwünsche ablehnen.", "begruendung": "Einträge können Beweismittel sein. Änderungen sind nur als nachvollziehbarer Nachtrag zulässig."}, "erstellt": "2026-05-25T07:00:00Z"}, {"id": "SUP-059", "name": "Fotos werden nicht hochgeladen", "kategorie": "Digitales Wachbuch: Einträge, Schichtübergabe und Berichte", "bezeichnung": "Foto-Upload wartet auf WLAN (Uhrsymbol am Eintrag).", "zusatz": {"produkt": "Fakturo Wachbuch", "wann": "Beim Speichern", "betriebss const ICONS = {

 K09:'<path d="M5 4h11a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2z"/><path d="M5 18a2 2 0 0 1 2-2h11M9 8h5"/>',
 K10:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'
};

const STUFEN = ["stufe1","stufe2","stufe3","stufe4"];

const S = {view:"home", q:"", answers:{}, skipped:[], tab:"Alle", detail:null, mode:null, mitRueck:false};
